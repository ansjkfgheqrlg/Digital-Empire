# Aggiunto da empire/flow (lotto G-C, Gael, CP-20260722): i 6 gate della
# settimana erano solo referenziati per nome negli step (`gate: Gate-X`) e
# nella tabella prosa di WF-MASTER.md §"Mappa gate" — qui formalizzati come
# dato macchina (deadline ISO-8601 + green_if valutabile), trascritti 1:1
# dalla tabella di WF-MASTER.md senza reinterpretarli (ADR-003: wrap).
# type: metric  -> letto da empire/.data/flow/facts.json
# type: file    -> controllo diretto su un file reale (esiste/contiene/non-contiene)
# type: human   -> richiede conferma esplicita via `flow gate --evidence`, mai auto-verde
# ═══════════════════════════════════════════════════════════════════
