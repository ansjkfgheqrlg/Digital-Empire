[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "EmpireDesk"
version = "3.0.0"
description = "Minimalist System Tray Command Center for Windows automation workflows (PySide6)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
build = ["pyinstaller>=5.0"]
llm = ["openai>=1.0"]

[project.scripts]
empire-desk = "empire_desk:main"

[tool.setuptools]
py-modules = ["empire_desk"]
