[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nerve-solve-orchestration-layer"
version = "0.1.0"
description = "NERVE-SOLVE Layer 1 orchestration runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "NERVE-SOLVE Engineering" }]
dependencies = [
  "pydantic>=2.12,<3",
  "cryptography>=46,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "coverage>=7.10,<8",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestration_layer"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orchestration_layer"]

[tool.coverage.run]
branch = true
source = ["orchestration_layer"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
