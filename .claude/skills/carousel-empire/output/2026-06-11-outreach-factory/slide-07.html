<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1080px;
  height: 1350px;
  background: #0A0A0A;
  font-family: 'Space Grotesk', system-ui, sans-serif;
  color: #FFFFFF;
  overflow: hidden;
  position: relative;
}

/* Subtle grid texture */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,61,0,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,61,0,0.02) 1px, transparent 1px);
  background-size: 72px 72px;
  pointer-events: none;
  z-index: 0;
}

/* Accent glow top-right */
body::after {
  content: '';
  position: absolute;
  top: -200px;
  right: -200px;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(255,61,0,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.slide {
  width: 1080px;
  height: 1350px;
  padding: 68px 80px 60px;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

/* ── Top bar ── */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  margin-bottom: 0;
}

.logo {
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #FFFFFF;
}

.logo .emp { color: #FF3D00; }

.counter {
  font-size: 14px;
  color: #888888;
  font-weight: 500;
  letter-spacing: 0.06em;
}

/* ── Content ── */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 36px;
}

/* ── Bottom bar ── */
.bottombar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 22px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  flex-shrink: 0;
}

.handle { font-size: 14px; color: #888888; letter-spacing: 0.05em; }
.swipe  { font-size: 13px; color: rgba(255,255,255,0.28); }

/* ── Tag/label ── */
.tag {
  display: inline-block;
  background: rgba(255,61,0,0.1);
  border: 1px solid rgba(255, 61, 0, 0.2);
  color: #FF3D00;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 9px 20px;
  border-radius: 4px;
  width: fit-content;
}

/* ── Typography ── */
h1 {
  font-size: 86px;
  font-weight: 800;
  line-height: 1.0;
  letter-spacing: -0.025em;
}

h2 {
  font-size: 64px;
  font-weight: 800;
  line-height: 1.08;
  letter-spacing: -0.02em;
}

.accent { color: #FF3D00; }
.gold   { color: #FFB800; }

.sub {
  font-size: 23px;
  line-height: 1.55;
  color: rgba(255,255,255,0.62);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
}

.divider {
  width: 56px;
  height: 3px;
  background: #FF3D00;
  border-radius: 2px;
  margin-top: 20px;
}

/* ── Cards ── */
.card {
  background: #141414;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 30px 36px;
}

.card.red-left  { border-left: 3px solid #FF3D00; }
.card.gold-left { border-left: 3px solid #FFB800; }

/* ── Step rows ── */
.step-row {
  display: flex;
  align-items: flex-start;
  gap: 24px;
}

.step-num {
  width: 50px;
  height: 50px;
  min-width: 50px;
  background: #FF3D00;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 800;
  color: white;
}

.step-body { flex: 1; }
.step-title { font-size: 23px; font-weight: 700; margin-bottom: 5px; }
.step-desc  { font-size: 17px; color: rgba(255,255,255,0.55); font-family: Inter, sans-serif; line-height: 1.5; }

/* ── Stat grid ── */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.stat-box {
  background: #141414;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 28px 28px;
}

.stat-num   { font-size: 68px; font-weight: 800; color: #FF3D00; line-height: 1; letter-spacing: -0.03em; }
.stat-label { font-size: 15px; color: #888888; font-family: Inter, sans-serif; margin-top: 8px; line-height: 1.4; }

/* ── List items (problem) ── */
.list-item {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  padding: 18px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.list-item:last-child { border-bottom: none; padding-bottom: 0; }
.list-x     { color: #FF3D00; font-size: 20px; flex-shrink: 0; margin-top: 1px; font-weight: 700; }
.list-text  { font-size: 21px; line-height: 1.45; color: rgba(255,255,255,0.82); }

/* ── Diff items ── */
.diff-item {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 15px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.diff-item:last-child { border-bottom: none; }

.diff-check {
  width: 34px;
  height: 34px;
  min-width: 34px;
  background: rgba(255,61,0,0.1);
  border: 1px solid rgba(255, 61, 0, 0.2);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: #FF3D00;
  font-weight: 700;
}

.diff-text { font-size: 20px; color: rgba(255,255,255,0.85); line-height: 1.3; }

/* ── CTA box ── */
.cta-box {
  background: #FF3D00;
  border-radius: 16px;
  padding: 44px 48px;
  text-align: center;
}

.cta-action { font-size: 48px; font-weight: 800; color: white; line-height: 1.1; margin-bottom: 14px; }
.cta-sub    { font-size: 20px; color: rgba(255,255,255,0.8); font-family: Inter, sans-serif; }

/* ── Benefit cards ── */
.benefit-stack { display: flex; flex-direction: column; gap: 14px; }
.benefit-card  { background: #141414; border: 1px solid rgba(255,255,255,0.07); border-left: 3px solid #FF3D00; border-radius: 12px; padding: 22px 26px; }
.benefit-title { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
.benefit-desc  { font-size: 16px; color: rgba(255,255,255,0.52); font-family: Inter, sans-serif; }
</style>
</head>
<body>
<div class="slide">

  <div class="topbar">
    <div class="logo">DIGITAL <span class="emp">EMPIRE</span></div>
    <div class="counter">7/7</div>
  </div>
  <div class="content">

    <div class="tag">PROSSIMO PASSO</div>
    <h2 style="font-size:58px;">Hai un business da scalare nell'outreach?</h2>
    <div class="cta-box">
      <div class="cta-action">Commenta AI</div>
      <div class='cta-sub'>Ti mando i dettagli in DM — call strategica gratuita</div>
    </div>
  </div>

  <div class="bottombar">
    <div class="handle">@digitalempireagency.e</div>
    <div class="swipe">Commenta AI ↙</div>
  </div>
</div>
</body>
</html>
