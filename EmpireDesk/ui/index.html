<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire Desk</title>
<style>
  :root{
    --slate-900:#1c2329; --slate-800:#232c33; --slate-700:#2f3940; --slate-600:#3f4f5a;
    --ink:#eef1f3; --muted:#9fb0bb; --line:#3a444c;
    --silver-0:#ffffff; --silver-50:#f4f6f8; --silver-100:#eaeef1; --silver-200:#dbe1e6;
    --accent:#fb4604; --accent-hover:#ff5c1f; --ok:#4fd17a; --err:#f2938c;
    --shadow: 0 10px 30px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.18);
    --r: 14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
  html,body{ height:100%; }
  body{
    font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #2a333a 0%, rgba(42,51,58,0) 55%),
      linear-gradient(160deg,#1c2329 0%, #171d22 60%, #12171b 100%);
    min-height:100%; display:flex; flex-direction:column; user-select:none;
  }

  header{ position:relative; background:linear-gradient(135deg,#20272d 0%, #262f36 60%, #2b353d 100%);
    padding:22px 34px 20px; border-bottom:1px solid var(--line); }
  header::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, rgba(251,70,4,0) 0%, rgba(251,70,4,.55) 50%, rgba(251,70,4,0) 100%); }
  .brand{ font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;
    font-weight:650; font-size:22px; letter-spacing:.2px; display:flex; align-items:center; gap:10px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 0 5px rgba(251,70,4,.16); }
  .subtitle{ margin-top:7px; font-size:12.5px; color:var(--muted); letter-spacing:.2px; }
  .hbtn{ position:absolute; top:22px; right:30px; appearance:none; cursor:pointer; font-family:inherit;
    border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink);
    font-size:13px; font-weight:600; padding:8px 15px; border-radius:10px;
    transition:background .15s ease, border-color .15s ease; }
  .hbtn:hover{ background:rgba(255,255,255,.1); border-color:rgba(251,70,4,.5); }

  main{ flex:1; padding:22px 30px 8px; display:flex; flex-direction:column; gap:16px; min-height:0; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }

  .tile{ background:var(--slate-800); border:1px solid var(--line); border-radius:var(--r);
    box-shadow:var(--shadow); padding:16px 16px 14px; display:flex; flex-direction:column; gap:8px;
    transition:transform .12s ease, border-color .16s ease; }
  .tile:hover{ transform:translateY(-2px); border-color:rgba(251,70,4,.35); }
  .tile .top{ display:flex; align-items:center; gap:10px; }
  .tile .icon{ font-size:22px; }
  .tile .name{ font-size:14.5px; font-weight:650; }
  .tile .desc{ font-size:12px; color:var(--muted); line-height:1.4; min-height:32px; }
  .tile .row2{ display:flex; align-items:center; gap:8px; margin-top:auto; }
  .tile input.urlin{ flex:1; min-width:0; font-size:12px; color:var(--ink); background:var(--slate-700);
    border:1px solid var(--slate-600); border-radius:8px; padding:8px 10px; outline:none; }
  .tile input.urlin:focus{ border-color:var(--accent); }
  .tbtn{ appearance:none; border:none; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:650;
    color:#fff; padding:9px 14px; border-radius:9px; white-space:nowrap;
    background:linear-gradient(180deg, var(--accent) 0%, #d43a02 100%);
    box-shadow:0 4px 12px rgba(251,70,4,.28); transition:filter .15s ease, transform .1s ease; }
  .tbtn:hover{ filter:brightness(1.08); }
  .tbtn:active{ transform:translateY(1px); }
  .tbtn[disabled]{ cursor:default; filter:grayscale(.35) brightness(.85); opacity:.7; box-shadow:none; }
  .tbtn.ghost{ background:var(--slate-700); box-shadow:none; border:1px solid var(--slate-600); }

  .badge{ font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; color:var(--muted); background:rgba(255,255,255,.05);
    border:1px solid var(--line); }
  .badge.running{ color:#1c2329; background:var(--accent); border-color:var(--accent); }
  .badge.ok{ color:var(--ok); border-color:rgba(79,209,122,.4); }
  .badge.error{ color:var(--err); border-color:rgba(242,147,140,.4); }

  .logwrap{ flex:1; display:flex; flex-direction:column; min-height:160px; }
  .logwrap .cap{ font-size:11px; font-weight:640; letter-spacing:.7px; text-transform:uppercase;
    color:var(--muted); margin:0 0 7px 2px; display:flex; justify-content:space-between; }
  .log{ flex:1; background:#12171b; color:#d7e0e6; border-radius:12px; padding:12px 14px;
    font-family:"Cascadia Code","Consolas",ui-monospace,monospace; font-size:12.5px; line-height:1.55;
    overflow:auto; box-shadow:inset 0 1px 3px rgba(0,0,0,.35); white-space:pre-wrap; user-select:text; }
  .log::-webkit-scrollbar{ width:9px; }
  .log::-webkit-scrollbar-thumb{ background:#3a444c; border-radius:8px; }
  .log::-webkit-scrollbar-track{ background:transparent; }

  footer{ padding:10px 30px 16px; text-align:center; font-size:11px; color:#6b7783; letter-spacing:.2px; }
  footer b{ color:#8a97a1; font-weight:600; }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>EMPIRE DESK</div>
    <div class="subtitle" id="subtitle">La plancia di comando di Digital Empire — v0.1</div>
    <button class="hbtn" id="selftestBtn">Selftest</button>
  </header>

  <main>
    <div class="grid" id="grid"></div>
    <div class="logwrap">
      <div class="cap"><span>Log</span><span id="logTile">—</span></div>
      <div class="log" id="log">Pronto. Premi «Avvia» su una tile per lanciare l'automazione reale.</div>
    </div>
  </main>

  <footer>Ogni tile lancia un processo <b>reale</b> — zero bottoni finti · exit code sempre visibile</footer>

<script>
  const $ = s => document.querySelector(s);
  const gridEl = $("#grid"), logEl = $("#log"), logTileEl = $("#logTile"), selftestBtn = $("#selftestBtn");

  // Bridge dual-mode: pywebview (finestra pywebview) oppure fetch HTTP (finestra Chrome-app)
  const API = window.pywebview ? {
    tiles:   () => window.pywebview.api.tiles(),
    launch:  (id, input) => window.pywebview.api.launch(id, input),
    poll:    (id) => window.pywebview.api.poll(id),
    stato:   () => window.pywebview.api.stato(),
    selftest:() => window.pywebview.api.selftest(),
  } : {
    tiles:   () => fetch('/api/tiles',{method:'POST'}).then(r=>r.json()).then(d=>d.tiles),
    launch:  (id, input) => fetch('/api/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,input})}).then(r=>r.json()),
    poll:    (id) => fetch('/api/poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).then(r=>r.json()),
    stato:   () => fetch('/api/stato',{method:'POST'}).then(r=>r.json()),
    selftest:() => fetch('/api/selftest',{method:'POST'}).then(r=>r.json()).then(d=>d.results),
  };

  const escapeHtml = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

  let tiles = [];
  let activeTile = null;
  let pollTimer = null;

  function badgeFor(t){
    if (t.running) return '<span class="badge running">in corso</span>';
    if (t.exit_code === 0) return '<span class="badge ok">ultimo OK</span>';
    if (t.exit_code != null) return '<span class="badge error">errore ('+t.exit_code+')</span>';
    return '<span class="badge">idle</span>';
  }

  const INPUT_PLACEHOLDER = { url: "URL YouTube…", path: "Percorso file carosello.json…" };

  function render(){
    gridEl.innerHTML = "";
    tiles.forEach(t=>{
      const card = document.createElement("div");
      card.className = "tile";
      const needsInput = !!t.input;
      const placeholder = INPUT_PLACEHOLDER[t.input] || "Input…";
      card.innerHTML = `
        <div class="top"><span class="icon">${t.icon}</span><span class="name">${escapeHtml(t.name)}</span></div>
        <div class="desc">${escapeHtml(t.desc)}</div>
        <div class="row2">
          ${badgeFor(t)}
          ${needsInput ? `<input class="urlin" placeholder="${escapeHtml(placeholder)}">` : ''}
          <button class="tbtn ${t.kind==='readonly' ? 'ghost' : ''}" data-id="${t.id}">
            ${t.kind==='readonly' ? 'Apri' : (t.running ? 'In corso…' : 'Avvia')}
          </button>
        </div>`;
      const btn = card.querySelector("button");
      if (t.running) btn.disabled = true;
      btn.addEventListener("click", ()=>{
        if (t.kind === "readonly") { openReadonly(t); return; }
        const input = needsInput ? card.querySelector(".urlin").value : null;
        launchTile(t.id, input);
      });
      gridEl.appendChild(card);
    });
  }

  async function refreshTiles(){
    try{ tiles = await API.tiles(); render(); }catch(e){ logLine("Errore lettura tile: "+e); }
  }

  function logLine(s){ logEl.textContent += "\n"+s; logEl.scrollTop = logEl.scrollHeight; }

  async function launchTile(id, input){
    activeTile = id;
    logTileEl.textContent = id;
    logEl.textContent = "Avvio "+id+"…";
    const r = await API.launch(id, input);
    if (!r.ok){ logLine("ERRORE: "+r.error); await refreshTiles(); return; }
    await refreshTiles();
    startPolling();
  }

  function startPolling(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async ()=>{
      if (!activeTile) return;
      const r = await API.poll(activeTile);
      (r.lines||[]).forEach(l=>logLine(l));
      if (!r.running){
        logLine("--- terminato, exit code: "+r.exit_code+" ---");
        clearInterval(pollTimer); pollTimer = null;
        await refreshTiles();
      }
    }, 600);
  }

  async function openReadonly(t){
    if (t.id === "stato"){
      activeTile = null;
      logTileEl.textContent = "STATO Empire (sola lettura)";
      const r = await API.stato();
      logEl.textContent = r.ok ? r.content : ("Errore: "+r.error);
    }
  }

  selftestBtn.addEventListener("click", async ()=>{
    logTileEl.textContent = "selftest";
    logEl.textContent = "Eseguo selftest (verifica path, nessun lancio reale)…";
    const results = await API.selftest();
    let ok = 0;
    let out = "";
    results.forEach(r=>{ out += "\n["+(r.ok?"OK  ":"FAIL")+"] "+r.name+(r.detail?(" — "+r.detail):""); if(r.ok) ok++; });
    out += "\n\nSELFTEST "+(ok===results.length?"PASS":"FAIL")+" ("+ok+"/"+results.length+")";
    logEl.textContent = out.trim();
  });

  refreshTiles();
  setInterval(refreshTiles, 4000);
</script>
</body>
</html>
