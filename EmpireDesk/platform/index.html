
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aureus Agency OS</title>
    <!-- Tailwind runtime vendorizzato in locale (stesso identico motore del CDN — app usabile offline).
         Fonte: https://cdn.tailwindcss.com, scaricato 2026-07-20. Zero differenze grafiche. -->
    <script src="/tailwind-cdn.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              platinum: {
                50: '#F5F7FA', // Ultra light silver
                100: '#E4E7EB', // Light silver
                200: '#CBD2D9', // Soft Silver
                300: '#9AA5B1', // Metallic
                400: '#7B8794', // Dark Silver
                500: '#616E7C', // Steel
                600: '#52606D',
                700: '#3E4C59',
                800: '#323F4B',
                900: '#1F2933',
              },
              silver: {
                light: '#E2E8F0',
                DEFAULT: '#CBD5E1',
                dark: '#94A3B8',
                accent: '#E6E6E6' // High gloss silver
              },
              // NEW AZURE SILVER PALETTE (Replacing Neon Cyan)
              diamond: {
                300: '#D6E6F2', // Ice Blue Silver (Highlights)
                400: '#94BBD9', // Azure Silver (Main Text/Icons) - Metallic Blue
                500: '#5D8AA8', // Steel Blue (Buttons/Borders) - The "Force" Color
                600: '#466D87', // Deep Steel
                950: '#0B1621', // Midnight Metal (Backgrounds)
                shadow: 'rgba(93, 138, 168, 0.4)' // Adjusted shadow to match Steel Blue
              },
              surface: {
                950: '#08090A', // Almost black
                900: '#111315', // Deep metallic charcoal
                800: '#1A1D21', // Dark metallic
                700: '#25282D',
                border: '#2D3136',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            backgroundImage: {
              'silver-gradient': 'linear-gradient(135deg, #F5F7FA 0%, #9AA5B1 100%)',
              'silver-sheen-bg': 'radial-gradient(circle at 50% -20%, #2D3748 0%, #000000 80%)',
              // New Gradient: From Ice Silver to Steel Blue
              'diamond-gradient': 'linear-gradient(135deg, #D6E6F2 0%, #5D8AA8 100%)',
            }
          }
        }
      }
    </script>
    <!-- Font Inter vendorizzato (stessi woff2 di Google Fonts, resa identica — app usabile offline) -->
    <link href="/fonts/inter.css" rel="stylesheet">
    <style>
      body {
        background-color: #050505;
        color: #CBD5E1;
        font-family: 'Inter', sans-serif;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020202; 
      }
      ::-webkit-scrollbar-thumb {
        background: #2D3136; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4B5563; 
      }
      
      /* TRUE SILVER CHROME TEXT EFFECT - Aggressive Metal */
      .text-silver-gradient {
        background: linear-gradient(180deg, #FFFFFF 0%, #E2E8F0 40%, #94A3B8 60%, #64748B 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        text-shadow: 0px 1px 0px rgba(255,255,255,0.1);
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      }

      .text-silver-muted {
        color: #9AA5B1;
      }

      /* METALLIC PANELS */
      .metallic-panel {
        background: linear-gradient(180deg, rgba(30, 35, 40, 0.9) 0%, rgba(15, 20, 25, 1) 100%);
        border: 1px solid rgba(200, 210, 220, 0.15); /* Slightly lighter border for silver look */
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
      }
      
      .metallic-panel-diamond {
        background-color: #0D0D0D;
        /* Updated to Steel Blue borders */
        border: 1px solid rgba(93, 138, 168, 0.3);
        box-shadow: 0 4px 20px -5px rgba(93, 138, 168, 0.15);
      }

      input, select, textarea {
        background-color: #111315 !important;
        border: 1px solid #333 !important;
        border-radius: 2px !important;
        color: #E2E8F0 !important;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5) !important;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #9AA5B1 !important;
        outline: none !important;
        box-shadow: 0 0 0 1px #9AA5B1, inset 0 2px 4px rgba(0,0,0,0.5) !important;
      }
      
      .soft-glow-bottom {
         /* Updated to Azure Silver glow */
         background: radial-gradient(ellipse at bottom, rgba(93, 138, 168, 0.2) 0%, transparent 70%);
      }

      /* GAMIFICATION SHAPES */
      .clip-path-hexagon {
        clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
      }
    </style>

</head>
