# =============================================================================
# REGISTRO DELL'ECOSISTEMA LANCI — LA FONTE DI VERITA' UNICA
# =============================================================================
#
# Questo file NON e' documentazione. E' il dato da cui i documenti citano e da
# cui gli script leggono. Se un documento dice una cosa diversa da qui, ha
# torto il documento.
#
# Perche' esiste: nella versione precedente del piano le stesse informazioni
# (sigle di reparto, nomi dei gate, elenco degli agenti) erano ricopiate a mano
# in undici documenti. Risultato misurato dai revisori: il dossier 03 usava sei
# sigle di reparto che non esistevano nel dossier 01; sette gate "GP-0..GP-6"
# convivevano con tre gate "GATE-PRD-1/2/3" senza mappa; una correzione fatta
# nel dossier 01 (scaglione minimo da 9 a 11 agenti) non era arrivata nel
# dossier 09, che e' proprio quello che si esegue.
#
# La prosa non puo' restare coerente con se stessa. Un dato validato da un
# programma si'.
#
# VALIDAZIONE:  python scripts/valida_registro.py
#   e' il comando che verifica gli invarianti dichiarati in fondo a questo file.
#   Se esce diverso da zero, il piano e' incoerente e non si costruisce.
#
# schema_version: la versione di QUESTO formato. Cambia solo se cambia la
# struttura del registro, mai per un dato nuovo dentro una struttura esistente.
# =============================================================================

schema_version: "1.0.0"
ecosistema:
  numero: 15
  sigla: "LAN"
  nome: "LANCI"
  cartella: "company/Ecosistemi/15-LANCI"
  registrato_in: "company/Ecosistemi/REGISTRO-NUMERI.md"
  adr_abilitante: "ADR-023"
  stato_adr: "da_registrare_prima_della_cartella"

# -----------------------------------------------------------------------------
# 1. IL MANDATO — dove sta questo ecosistema nella catena degli organi
# -----------------------------------------------------------------------------
# Non e' una dichiarazione di intenti: e' la ragione per cui i confini sono
# dove sono. ADR-016 ha chiuso il buco "prodotto -> pubblicato" e ha dichiarato
# aperto quello successivo. Questo ecosistema e' quel buco.
mandato:
  frase: "Porta un prodotto gia' pubblicabile da 'pubblicato' a 'venduto e misurato'."
  anello_precedente:
    organo: "ULTIMO METRO"
    adr: "ADR-016"
    copre: "prodotto -> pubblicato"
  anello_proprio:
    copre: "pubblicato -> venduto -> misurato"
  anello_successivo:
    organo: "TESORERIA"
    adr: "ADR-020"
    copre: "l'euro nei conti dell'azienda"
  citazione_adr_016: >-
    "Non esiste una misura di cosa succede DOPO la pubblicazione. L'Ultimo Metro
    chiude il buco fra 'prodotto' e 'pubblicato'; resta aperto quello fra
    'pubblicato' e 'venduto'. E' il prossimo da chiudere."

# -----------------------------------------------------------------------------
# 2. GLI ARTEFATTI — il sistema E' questa catena
# -----------------------------------------------------------------------------
# Il centro dell'architettura non e' l'organigramma: e' l'artefatto.
# Ogni riga qui sotto e' un contratto completo, e ogni campo e' obbligatorio.
#
#   id             sigla univoca, usata ovunque
#   file           il nome del file dentro lanci/<lancio_id>/
#   afferma        cosa quel file dichiara vero (in italiano, una riga)
#   schema         il file JSON Schema che lo valida
#   produttore     l'agente che lo scrive          <- unico proprietario di scrittura
#   giudice        l'agente che lo giudica         <- INVARIANTE: != produttore
#   gate           il controllo che lo blocca
#   dipende_da     gli artefatti che devono esistere e essere validi prima
#   se_fallisce    dove torna il lancio quando il gate boccia  <- mai vuoto
#   umano          se richiede una firma umana per essere valido
artefatti:

  - id: "ART-PUB"
    file: "pubblico.json"
    afferma: "quante persone possiamo mettere davanti all'offerta il giorno dell'apertura, per canale, con la prova di ognuna"
    schema: "schemi/pubblico.schema.json"
    produttore: "lan-pub-censore"
    giudice: "lan-gate"
    gate: "GATE-PUB-1"
    dipende_da: []
    se_fallisce: "IDEA"
    umano: false
    nuovo_in_v4: true
    perche_nuovo: >-
      La versione precedente non aveva questo artefatto e progettava il lancio del
      Manuale Claude Code senza sapere che il canale YouTube destinato a portargli
      pubblico era stato dichiarato "funnel morto" e dirottato su @dosementale il
      2026-07-29 (second-brain-vault/wiki/log.md righe 1054-1063). Senza questo
      artefatto l'azienda scopre di non avere pubblico il giorno dell'apertura,
      dopo aver speso tutto il resto.

  - id: "ART-DEC"
    file: "decisione.json"
    afferma: "questo lancio si fa adesso, e non un altro"
    schema: "schemi/decisione.schema.json"
    produttore: "lan-str-filtro"
    giudice: "lan-gate"
    gate: "GATE-STR-1"
    dipende_da: ["ART-PUB"]
    se_fallisce: "ARCHIVIATO"
    umano: false

  - id: "ART-CRT"
    file: "certificato.json"
    afferma: "il prodotto e' consegnabile a un cliente pagante senza vergogna e senza rischio"
    schema: "schemi/certificato.schema.json"
    produttore: "lan-prd-collaudatore"
    giudice: "lan-gate"
    gate: "GATE-PRD-1"
    dipende_da: ["ART-DEC"]
    se_fallisce: "VALUTATO"
    umano: false
    modalita_ammesse: ["integrale", "retroattiva"]
    nota_retroattiva: >-
      La modalita' retroattiva esiste per i prodotti gia' finiti (il Manuale e' pronto
      dal 07/03/2026 e non e' mai passato da un flusso di produzione). Senza, il
      reparto costruito per sbloccare quel prodotto risulta inaccessibile a quel
      prodotto: il revisore ha dimostrato che il flusso usciva con codice 2 alla
      prima riga di input.

  - id: "ART-RIC"
    file: "ricerca.json"
    afferma: "le parole vere del pubblico e i buchi veri dei concorrenti, ognuna con la fonte"
    schema: "schemi/ricerca.schema.json"
    produttore: "lan-int-analista"
    giudice: "lan-gate"
    gate: "GATE-INT-1"
    dipende_da: ["ART-DEC"]
    se_fallisce: "VALUTATO"
    umano: false

  - id: "ART-PRV"
    file: "previsione.json"
    afferma: "quanto ci aspettiamo di incassare, con la banda e le assunzioni dichiarate"
    schema: "schemi/previsione.schema.json"
    produttore: "lan-prv-modello"
    giudice: "lan-gate"
    gate: "GATE-PRV-1"
    dipende_da: ["ART-PUB", "ART-RIC"]
    se_fallisce: "ISTRUITO"
    umano: false
    nuovo_in_v4: true
    perche_nuovo: >-
      In 3.718 righe la versione precedente non conteneva mai la domanda "quanto ci
      aspettiamo di incassare". Conseguenze misurate: la firma del prezzo restava
      cieca (si sceglie un numero, non un risultato); il gate del budget pretendeva
      "il pareggio calcolato" che nessun artefatto produceva, quindi era
      insoddisfacibile; e senza previsione il consuntivo e' un numero solo, senza
      scarto, quindi la memoria ereditava un compito impossibile. Chiude anche
      B-043 ("DE non misura un solo euro").

  - id: "ART-OFF"
    file: "offerta.json"
    afferma: "il prezzo, la data e la struttura dell'offerta, firmati da una persona"
    schema: "schemi/offerta.schema.json"
    produttore: "lan-off-conductor"
    giudice: "lan-gate"
    gate: "GATE-OFF-1"
    dipende_da: ["ART-CRT", "ART-PRV"]
    se_fallisce: "ISTRUITO"
    umano: true
    firma_obbligatoria: "firma"

  - id: "ART-CPY"
    file: "copy/manifest.json"
    afferma: "tutti i testi del lancio, ognuno col suo punteggio calcolato e la sua destinazione"
    schema: "schemi/copy.schema.json"
    produttore: "lan-cpy-conductor"
    giudice: "lan-gate"
    gate: "GATE-CPY-1"
    dipende_da: ["ART-OFF", "ART-RIC"]
    se_fallisce: "DATATO"
    umano: false

  - id: "ART-FNL"
    file: "funnel.json"
    afferma: "le pagine sono online, misurano, e la cassa ha incassato un pagamento di prova vero"
    schema: "schemi/funnel.schema.json"
    produttore: "lan-fnl-costruttore"
    giudice: "lan-gate"
    gate: "GATE-FNL-1"
    dipende_da: ["ART-CPY", "ART-OFF"]
    se_fallisce: "IN_PRODUZIONE"
    umano: false
    nota_cassa: >-
      La prova di cassa e' dentro questo gate e non in fondo: la versione precedente
      metteva la pubblicazione irreversibile prima della prova che il pagamento
      funzionasse. Si vende solo dopo che un euro vero e' entrato ed e' stato
      rimborsato in prova.

  - id: "ART-EDT"
    file: "editoriale.json"
    afferma: "i contenuti dei giorni del lancio, ognuno con la data di uscita e dove porta"
    schema: "schemi/editoriale.schema.json"
    produttore: "lan-edt-pianificatore"
    giudice: "lan-gate"
    gate: "GATE-EDT-1"
    dipende_da: ["ART-OFF", "ART-CPY"]
    se_fallisce: "IN_PRODUZIONE"
    umano: false

  - id: "ART-BDG"
    file: "budget.json"
    afferma: "quanto costa questo lancio, quanto costa farlo girare, e a quante copie va in pari"
    schema: "schemi/budget.schema.json"
    produttore: "lan-tsr-contabile"
    giudice: "lan-gate"
    gate: "GATE-TSR-1"
    dipende_da: ["ART-PRV", "ART-OFF"]
    se_fallisce: "DATATO"
    umano: false

  - id: "ART-APE"
    file: "apertura.json"
    afferma: "tutte le condizioni di apertura sono vere insieme, e una persona ha dato il via"
    schema: "schemi/apertura.schema.json"
    produttore: "lan-reg-calendarista"
    giudice: "lan-gate"
    gate: "GATE-REG-1"
    dipende_da: ["ART-FNL", "ART-EDT", "ART-BDG", "ART-CPY"]
    se_fallisce: "IN_PRODUZIONE"
    umano: true
    firma_obbligatoria: "via_libera"

  - id: "ART-CNS"
    file: "consuntivo.json"
    afferma: "quanto e' entrato davvero, da dove, e quanto e' costato davvero"
    schema: "schemi/consuntivo.schema.json"
    produttore: "lan-reg-tracciatore"
    giudice: "lan-gate"
    gate: "GATE-CNS-1"
    dipende_da: ["ART-APE"]
    se_fallisce: "APERTO"
    umano: false
    nuovo_in_v4: true
    perche_nuovo: >-
      Nella versione precedente il consuntivo era un markdown ("consuntivo.md"), cioe'
      un testo. Un testo non si confronta con una previsione. Qui e' un artefatto
      tipizzato, ed e' la meta' che rende possibile lo scarto.

  - id: "ART-DBR"
    file: "debrief.json"
    afferma: "previsione contro realta', ogni scarto con la sua causa, e cosa il prossimo lancio deve fare di diverso"
    schema: "schemi/debrief.schema.json"
    produttore: "lan-mem-distillatore"
    giudice: "lan-gate"
    gate: "GATE-MEM-1"
    dipende_da: ["ART-CNS", "ART-PRV"]
    se_fallisce: "CHIUSO"
    umano: false
    controfirma: "lan-reg-calendarista"
    nota_controfirma: >-
      La Regia ha eseguito il lancio, la Memoria lo giudica, e la Regia controfirma:
      nessuno dei due scrive da solo la storia di com'e' andata. Ma la controfirma e'
      un CAMPO dell'artefatto, non il ruolo di giudice — perche' lan-reg-calendarista
      ha permesso di scrittura e un giudice che puo' riscrivere cio' che giudica non
      e' un giudice (INV-09). Il primo giro del validatore ha bocciato proprio questa
      riga, scritta un'ora prima: e' la prova che l'invariante serve.

# -----------------------------------------------------------------------------
# 3. I GATE — un controllo che non puo' fallire non e' un controllo
# -----------------------------------------------------------------------------
# Ogni gate ha, obbligatoriamente:
#   criterio_eseguibile  il predicato, non una frase italiana
#   dato_da_terzi        i dati che il gate usa NON possono essere prodotti da chi
#                        e' giudicato (altrimenti e' auto-soddisfacibile)
#   ramo_fallimento      cosa succede quando boccia: dove torna, cosa si conserva
#   exit_code            0 passa · 1 blocca con verbale · 2 input non valido · 3 ambiente
#   test_rosso           il caso costruito apposta perche' fallisca: se non fallisce,
#                        il gate e' decorativo
gate:

  - id: "GATE-PUB-1"
    presidia: "ART-PUB"
    criterio_eseguibile: >-
      somma(canali[].raggiungibili_verificati) > 0 AND ogni canale ha prova.tipo in
      [esporto-lista, schermata-conteggio-piattaforma, misura-analytics] con data
      non anteriore a 30 giorni
    dato_da_terzi: "il conteggio viene letto dalla piattaforma, non dichiarato dall'agente"
    ramo_fallimento: "il lancio torna a IDEA con bloccato_da='nessun pubblico verificato'; l'artefatto resta sul disco"
    exit_code: 1
    test_rosso: "un pubblico.json con 3 canali tutti a raggiungibili_verificati=0 deve BLOCCARE"

  - id: "GATE-STR-1"
    presidia: "ART-DEC"
    criterio_eseguibile: "tutte e cinque le domande hanno risposta in [si, no] e nessuna e' 'no'"
    dato_da_terzi: "le risposte citano artefatti esistenti su disco, verificati dal gate"
    ramo_fallimento: "ARCHIVIATO con la ragione; l'idea resta consultabile e riproponibile con un elemento nuovo"
    exit_code: 1
    test_rosso: "una decisione con una sola risposta 'no' deve BLOCCARE"

  - id: "GATE-PRD-1"
    presidia: "ART-CRT"
    criterio_eseguibile: >-
      bandiere_rosse[].presente tutte false AND file_prodotto esiste e dimensione>0
      AND ogni link del prodotto testato con esito registrato AND
      (modalita=='integrale' OR (modalita=='retroattiva' AND debito_collaudo dichiarato))
    dato_da_terzi: "i link sono testati dal gate, non dichiarati dal produttore"
    ramo_fallimento: "VALUTATO, con l'elenco puntuale di cosa manca; il certificato parziale si conserva"
    exit_code: 1
    test_rosso: "un prodotto con un link morto deve BLOCCARE senza intervento umano"

  - id: "GATE-INT-1"
    presidia: "ART-RIC"
    criterio_eseguibile: >-
      frasi.count >= 15 AND ogni frase ha fonte.url AND campione_verificato.count >= 3
      AND ogni elemento del campione ha esito.raggiungibile == true
    dato_da_terzi: "il campione viene riaperto dal gate, non dall'analista"
    ramo_fallimento: "VALUTATO; le frasi con fonte valida si conservano, quelle senza si scartano con elenco"
    exit_code: 1
    test_rosso: "una ricerca con 20 frasi plausibili e zero fonti raggiungibili deve BLOCCARE"

  - id: "GATE-PRV-1"
    presidia: "ART-PRV"
    criterio_eseguibile: >-
      scenari ha esattamente [pessimista, atteso, ottimista] AND ogni scenario ha
      ricavo_lordo calcolato dalla formula dichiarata AND ogni assunzione ha
      stato in [misurato, assunto] AND nessuna assunzione con stato=='misurato'
      priva di fonte
    dato_da_terzi: "pubblico e prezzo arrivano da ART-PUB e ART-OFF, non li sceglie il modello"
    ramo_fallimento: "ISTRUITO; la previsione si conserva marcata non_valida con il motivo"
    exit_code: 1
    test_rosso: "una previsione con un tasso di conversione dichiarato 'misurato' e senza fonte deve BLOCCARE"

  - id: "GATE-OFF-1"
    presidia: "ART-OFF"
    criterio_eseguibile: >-
      prezzo e' numero > 0 AND prezzo non in lista_valori_evasivi AND data_apertura
      e' data futura valida AND durata_carrello_gg > 0 AND ruolo_prodotto in
      [vendita, acquisizione-contatti] AND firma.canale in canali_firma_ammessi AND
      firma.proposta_hash == sha256(file proposta corrente) AND
      somma(bonus[].valore dove fonte_valore != null) usata per rapporto_valore_prezzo
    dato_da_terzi: >-
      la firma non e' scrivibile da nessun agente: il campo e' rifiutato se il canale
      non e' in lista chiusa, e l'hash lega la firma al testo esatto firmato
    ramo_fallimento: "ISTRUITO; la proposta si conserva, la firma decade e O5 si riapre"
    exit_code: 1
    test_rosso: >-
      due casi: (a) un offerta.json con firma.chi='Max' scritta da un agente e canale
      non ammesso deve BLOCCARE; (b) una firma valida su una proposta poi rigenerata
      deve BLOCCARE per hash non corrispondente

  - id: "GATE-CPY-1"
    presidia: "ART-CPY"
    criterio_eseguibile: >-
      punteggio_totale >= 80 AND nessun blocco sotto il 50% dei propri punti AND
      ogni affermazione con categoria=='prova' ha riferimento risolvibile
    dato_da_terzi: "le prove sono risolte contro ART-CRT e ART-RIC, non contro il testo stesso"
    ramo_fallimento: "DATATO; i testi sopra soglia si conservano, si rifanno solo i blocchi bocciati"
    exit_code: 1
    test_rosso: "un testo con punteggio 85 ma un blocco al 30% dei suoi punti deve BLOCCARE"

  - id: "GATE-FNL-1"
    presidia: "ART-FNL"
    criterio_eseguibile: >-
      ogni pagina risponde 200 AND ogni pagina ha evento_conversione con
      prova.origine=='piattaforma' AND prova_cassa.stato=='incassato_e_rimborsato'
      AND prova_cassa.riferimento_transazione != null
    dato_da_terzi: "l'evento si legge dalla piattaforma di misura; la transazione dal fornitore di pagamento"
    ramo_fallimento: "IN_PRODUZIONE con l'elenco delle pagine non conformi; le pagine conformi restano"
    exit_code: 1
    test_rosso: "un funnel con tutte le pagine a 200 ma senza transazione di prova deve BLOCCARE"

  - id: "GATE-EDT-1"
    presidia: "ART-EDT"
    criterio_eseguibile: >-
      nessuna riga con campi obbligatori vuoti AND ogni contenuto ha destinazione
      risolvibile in ART-FNL AND ogni giorno del carrello ha almeno un contenuto
    dato_da_terzi: "le destinazioni sono verificate contro il funnel reale"
    ramo_fallimento: "IN_PRODUZIONE; il piano si conserva con le righe incomplete evidenziate"
    exit_code: 1
    test_rosso: "un piano con un contenuto che punta a una pagina inesistente deve BLOCCARE"

  - id: "GATE-TSR-1"
    presidia: "ART-BDG"
    criterio_eseguibile: >-
      costo_totale_previsto <= tetto AND pareggio.copie calcolato da ART-PRV AND
      costo_macchina_previsto presente e > 0
    dato_da_terzi: "il pareggio usa il ricavo previsto di ART-PRV, non un numero del contabile"
    ramo_fallimento: "DATATO; il budget si conserva marcato oltre_tetto con lo scostamento"
    exit_code: 1
    test_rosso: "un budget senza costo_macchina_previsto deve BLOCCARE"

  - id: "GATE-TSR-2"
    presidia: "ART-BDG"
    tipo: "continuo"
    criterio_eseguibile: "scarto_percentuale(speso, previsto) <= 10"
    dato_da_terzi: "lo speso si legge dai movimenti registrati, non dalla dichiarazione"
    ramo_fallimento: "IN_PRODUZIONE -> DATATO: la spesa nuova si blocca, il lancio non muore; sblocco solo con firma umana tracciata"
    exit_code: 1
    test_rosso: "uno scarto dell'11% deve bloccare la spesa nuova e NON uccidere il lancio"

  - id: "GATE-REG-1"
    presidia: "ART-APE"
    criterio_eseguibile: >-
      tutte le voci della lista_sincronizzazione hanno esito==true AND
      via_libera.canale in canali_firma_ammessi AND
      tutti gli artefatti da ART-PUB a ART-BDG sono validi contro il proprio schema
    dato_da_terzi: "la validita' degli artefatti e' ricalcolata dai file, mai letta dallo stato"
    ramo_fallimento: "IN_PRODUZIONE con l'elenco delle voci false"
    exit_code: 1
    test_rosso: "una lista con nove voci vere e una falsa deve BLOCCARE"

  - id: "GATE-CNS-1"
    presidia: "ART-CNS"
    criterio_eseguibile: >-
      ricavo_lordo ha origine in [fornitore-pagamento, esporto-piattaforma] AND
      periodo copre tutte le date del carrello AND ordini.count coerente con ricavo/prezzo
    dato_da_terzi: "il ricavo si legge dal fornitore di pagamento, mai dichiarato"
    ramo_fallimento: "APERTO: il lancio non chiude finche' il consuntivo non ha un'origine verificabile"
    exit_code: 1
    test_rosso: "un consuntivo con ricavo dichiarato a mano e origine assente deve BLOCCARE"

  - id: "GATE-MEM-1"
    presidia: "ART-DBR"
    criterio_eseguibile: >-
      ogni scarto oltre il 10% fra ART-PRV e ART-CNS ha causa scritta AND
      schemi.count >= 3 AND ogni schema ha si_applica_quando non vuoto AND
      ogni record di memoria della fase cita un artefatto esistente su disco
    dato_da_terzi: "gli scarti sono ricalcolati dal gate confrontando i due artefatti"
    ramo_fallimento: "CHIUSO: il lancio resta chiuso e non diventa APPRESO finche' il debrief non e' completo"
    exit_code: 1
    test_rosso: >-
      un debrief con tre schemi generici e uno scarto del 40% senza causa deve BLOCCARE;
      e un record di memoria con corpo 'ok' e fonti vuote deve BLOCCARE

# -----------------------------------------------------------------------------
# 4. GLI STATI — la macchina, con tutte le transizioni e nessuna via senza uscita
# -----------------------------------------------------------------------------
stati:
  - {id: "IDEA",          descrizione: "proposta, non ancora filtrata"}
  - {id: "VALUTATO",      descrizione: "ha passato il filtro, si istruisce"}
  - {id: "ISTRUITO",      descrizione: "pubblico, ricerca, prodotto e previsione pronti; manca prezzo e data"}
  - {id: "DATATO",        descrizione: "prezzo e data firmati: il conto alla rovescia e' partito"}
  - {id: "IN_PRODUZIONE", descrizione: "testi, pagine, contenuti e budget in costruzione"}
  - {id: "PRONTO",        descrizione: "tutte le condizioni di apertura vere insieme"}
  - {id: "APERTO",        descrizione: "si vende"}
  - {id: "CHIUSO",        descrizione: "la vendita e' finita, il consuntivo esiste, il debrief no"}
  - {id: "APPRESO",       descrizione: "debrief completo con gli scarti spiegati - l'unico finale buono"}
  - {id: "SOSPESO",       descrizione: "fermo, con stato di partenza, data di revisione e comando di uscita"}
  - {id: "ABORTITO",      descrizione: "chiuso per decisione umana, con cosa si salva"}
  - {id: "ARCHIVIATO",    descrizione: "idea respinta, conservata con la ragione"}

transizioni:
  - {da: "IDEA",          a: "VALUTATO",           condizione: "GATE-PUB-1 e GATE-STR-1 passano",                       autorizza: "sistema"}
  - {da: "IDEA",          a: "ARCHIVIATO",         condizione: "GATE-STR-1 boccia",                                     autorizza: "sistema"}
  - {da: "ARCHIVIATO",    a: "IDEA",               condizione: "riproposta con elemento nuovo",                         autorizza: "L2"}
  - {da: "VALUTATO",      a: "ISTRUITO",           condizione: "GATE-PRD-1, GATE-INT-1, GATE-PRV-1 passano",            autorizza: "sistema"}
  - {da: "VALUTATO",      a: "ARCHIVIATO",         condizione: "il prodotto non e' certificabile",                      autorizza: "L2"}
  - {da: "ISTRUITO",      a: "DATATO",             condizione: "GATE-OFF-1 passa con firma umana",                      autorizza: "persona"}
  - {da: "DATATO",        a: "IN_PRODUZIONE",      condizione: "GATE-TSR-1 passa",                                      autorizza: "sistema"}
  - {da: "IN_PRODUZIONE", a: "DATATO",             condizione: "GATE-TSR-2 boccia in corsa",                            autorizza: "sistema"}
  - {da: "IN_PRODUZIONE", a: "PRONTO",             condizione: "GATE-REG-1 passa",                                      autorizza: "sistema"}
  - {da: "PRONTO",        a: "IN_PRODUZIONE",      condizione: "un gate rifiuta dopo la sincronizzazione",              autorizza: "il gate"}
  - {da: "PRONTO",        a: "APERTO",             condizione: "via libera firmato",                                    autorizza: "persona"}
  - {da: "APERTO",        a: "CHIUSO",             condizione: "data di chiusura raggiunta",                            autorizza: "persona"}
  - {da: "CHIUSO",        a: "APPRESO",            condizione: "GATE-CNS-1 e GATE-MEM-1 passano",                       autorizza: "sistema"}
  - {da: "*",             a: "SOSPESO",            condizione: "punto umano scaduto senza default, o conflitto irrisolto", autorizza: "sistema"}
  - {da: "SOSPESO",       a: "stato_di_partenza",  condizione: "la causa e' rimossa",                                   autorizza: "L2 con verbale"}
  - {da: "SOSPESO",       a: "ABORTITO",           condizione: "90 giorni, proposta a Max",                             autorizza: "solo Max"}
  - {da: "*",             a: "ABORTITO",           condizione: "decisione",                                             autorizza: "solo Max"}

# Gli orologi si fermano quando il lancio e' SOSPESO. Senza questa riga, un lancio
# sospeso per mancanza di firma accumula scadenze di consegna che scattano tutte
# insieme al risveglio: e' il difetto rilevato dal revisore sul dossier 01.
orologi:
  congelati_in: ["SOSPESO"]
  ripartono_da: "il valore che avevano all'ingresso in SOSPESO"

# -----------------------------------------------------------------------------
# 5. I PUNTI UMANI — ognuno con scadenza, default e comportamento allo scadere
# -----------------------------------------------------------------------------
# Regola generale, ricavata dal difetto piu' grave della versione precedente:
# il cronometro non sta sulla firma del prezzo, sta su OGNI punto umano aperto.
# Il Manuale Claude Code si e' fermato per sei mesi su un punto (il ruolo del
# prodotto) che nella versione precedente non aveva ne' scadenza ne' default, e
# il contatore dell'inerzia contava i giorni "da quando la proposta aspetta" —
# una proposta che in quel ramo non nasce mai. Il fallimento era invisibile alla
# sua stessa misura.
punti_umani:

  - id: "PU-RUOLO"
    domanda: "Il prodotto si vende o e' un regalo per acquisire contatti?"
    apre_su: "ART-OFF fase O1"
    scadenza_giorni: 7
    default: "vendita"
    default_giustificato_da: >-
      la strada "vendita" e' reversibile (un prodotto venduto puo' diventare un regalo
      dopo), la strada "regalo" non lo e' (un prodotto regalato non si rimette in
      vendita senza bruciare chi l'ha avuto gratis). Fra due strade, quando scade il
      tempo, si prende quella da cui si torna indietro.
    allo_scadere: "si procede col default, si scrive scelto_per_silenzio=true e revisione_il, e si avvisa"
    revocabile: true

  - id: "PU-PREZZO"
    domanda: "Confermi il prezzo e la data proposti?"
    apre_su: "ART-OFF fase O5"
    scadenza_giorni: 14
    default: null
    default_giustificato_da: >-
      qui NON c'e' default, ed e' deliberato: un prezzo scelto da una macchina per
      sbloccare un gate produce un danno che si scopre a lancio finito. Il rinvio si
      vede e si corregge.
    allo_scadere: "SOSPESO con revisione_il e come_si_esce come comando eseguibile"
    revocabile: false

  - id: "PU-APERTURA"
    domanda: "Do il via libera all'apertura della vendita?"
    apre_su: "ART-APE"
    scadenza_giorni: null
    default: null
    default_giustificato_da: "irreversibile verso l'esterno: non ha e non avra' mai un default"
    allo_scadere: "resta in PRONTO, senza scadenza"
    revocabile: false

  - id: "PU-INVIO"
    domanda: "Autorizzo l'invio reale alla lista?"
    apre_su: "ART-EDT, ogni invio"
    scadenza_giorni: null
    default: null
    default_giustificato_da: "un'email spedita non si richiama"
    allo_scadere: "l'invio non parte"
    revocabile: false

  - id: "PU-SPESA"
    domanda: "Autorizzo questa spesa oltre il tetto?"
    apre_su: "GATE-TSR-2"
    scadenza_giorni: null
    default: null
    default_giustificato_da: "impegna denaro vero"
    allo_scadere: "la spesa non parte, il lancio prosegue con quanto gia' speso"
    revocabile: false

  - id: "PU-COPERTINA"
    domanda: "La copertina la fa Max: e' pronta?"
    apre_su: "ART-CPY e ART-EDT, per ogni pezzo che ne ha bisogno"
    scadenza_giorni: 3
    default: null
    default_giustificato_da: >-
      regola dell'Impero non negoziabile: la copertina la fa Max, la macchina fornisce
      solo cartella aperta, titolo e due righe di brief. Nessun default possibile.
      Era il punto umano piu' frequente dell'intero piano e non compariva in nessuna
      tabella dei punti umani.
    allo_scadere: "il pezzo resta in attesa e compare nell'elenco di cosa blocca il lancio"
    revocabile: false

canali_firma_ammessi:
  - "comando-utente"      # la persona ha digitato il comando con --firma
  - "chat-firmata"        # la persona ha risposto in chat e il riferimento e' registrato
  - "file-fuori-agenti"   # un file che nessun agente ha permesso di scrivere
# Nessun agente ha permesso di scrittura sul sotto-oggetto "firma" di ART-OFF e
# sul "via_libera" di ART-APE. Senza questa riga il campo firmato_da e' una
# stringa che qualunque agente in ciclo di auto-riparazione puo' riempire con
# "Max" per sbloccarsi — ed e' il fallimento peggiore possibile di tutto il
# sistema, peggiore del blocco che vuole curare.

# -----------------------------------------------------------------------------
# 6. GLI AGENTI — nucleo minimo, derivato dagli artefatti e non elencato a mano
# -----------------------------------------------------------------------------
# Il nucleo minimo NON e' una scelta: e' l'insieme dei produttori degli artefatti
# necessari a portare un lancio da IDEA ad APPRESO, piu' il giudice. Si calcola,
# non si decide. Lo verifica valida_registro.py.
#
# grado:  scagnozzo (haiku, un controllo) · sentinella (sonnet, una missione) ·
#         doombot (opus, progetta e costruisce)
# Il grado determina il modello, e il modello determina il costo.
agenti:

  - id: "lan-direttore"
    grado: "doombot"
    modello: "claude-opus-5"
    produce: []
    ruolo: "orchestra il lancio, unico interlocutore umano mentre corre"
    tools: ["Read", "Write", "Edit", "Bash", "Glob", "Grep"]

  - id: "lan-gate"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["verbali"]
    ruolo: "esegue TUTTI i gate. Non produce nessun artefatto giudicato da se'"
    tools: ["Read", "Bash", "Glob", "Grep"]
    nota_tools: >-
      NON ha Write ne' Edit, e non e' un dettaglio: un giudice che puo' riscrivere
      cio' che giudica non e' un giudice. I verbali li scrive lo script, non l'agente.

  - id: "lan-pub-censore"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-PUB"]
    ruolo: "conta le persone raggiungibili per canale e porta la prova di ogni numero"
    tools: ["Read", "Write", "Bash", "Glob", "Grep"]

  - id: "lan-str-filtro"
    grado: "scagnozzo"
    modello: "claude-haiku-4-5-20251001"
    produce: ["ART-DEC"]
    ruolo: "le cinque domande del filtro, ognuna con l'artefatto che la sostiene"
    tools: ["Read", "Write", "Glob", "Grep"]

  - id: "lan-prd-collaudatore"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-CRT"]
    ruolo: "certifica il prodotto, anche in modalita' retroattiva per cio' che e' gia' finito"
    tools: ["Read", "Write", "Bash", "Glob", "Grep"]

  - id: "lan-int-analista"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-RIC"]
    ruolo: "porta le parole vere del pubblico, ognuna con la fonte apribile"
    tools: ["Read", "Write", "Bash", "Glob", "Grep", "WebFetch"]

  - id: "lan-prv-modello"
    grado: "scagnozzo"
    modello: "claude-haiku-4-5-20251001"
    produce: ["ART-PRV"]
    ruolo: "applica la formula del ricavo previsto ai numeri che riceve"
    tools: ["Read", "Write", "Bash"]
    nota: >-
      E' il grado piu' basso di proposito: qui non c'e' niente da interpretare, c'e'
      una formula da applicare. Un modello linguistico che "ragiona" su un calcolo
      deterministico e' un modo caro di sbagliare.

  - id: "lan-off-conductor"
    grado: "doombot"
    modello: "claude-opus-5"
    produce: ["ART-OFF"]
    ruolo: "istruisce prezzo e data fino a renderli una conferma di dieci secondi"
    tools: ["Read", "Write", "Edit", "Bash", "Glob", "Grep"]
    vincolo_scrittura: "NON puo' scrivere il sotto-oggetto firma"

  - id: "lan-cpy-conductor"
    grado: "doombot"
    modello: "claude-opus-5"
    produce: ["ART-CPY"]
    ruolo: "tutti i testi del lancio, nell'ordine in cui il funnel li usa"
    tools: ["Read", "Write", "Edit", "Glob", "Grep"]

  - id: "lan-fnl-costruttore"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-FNL"]
    ruolo: "mette online le pagine e prova che misurano e che la cassa incassa"
    tools: ["Read", "Write", "Edit", "Bash", "Glob", "Grep"]

  - id: "lan-edt-pianificatore"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-EDT"]
    ruolo: "riempie i giorni del lancio di contenuti che escono davvero"
    tools: ["Read", "Write", "Edit", "Glob", "Grep"]

  - id: "lan-tsr-contabile"
    grado: "scagnozzo"
    modello: "claude-haiku-4-5-20251001"
    produce: ["ART-BDG"]
    ruolo: "somma i costi, calcola il pareggio dalla previsione, sorveglia lo scarto"
    tools: ["Read", "Write", "Bash"]

  - id: "lan-reg-calendarista"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-APE"]
    ruolo: "il calendario a ritroso, la lista di sincronizzazione, la controfirma del debrief"
    tools: ["Read", "Write", "Edit", "Bash", "Glob", "Grep"]

  - id: "lan-reg-tracciatore"
    grado: "scagnozzo"
    modello: "claude-haiku-4-5-20251001"
    produce: ["ART-CNS"]
    ruolo: "legge i numeri veri dal fornitore di pagamento e dalla piattaforma di misura"
    tools: ["Read", "Write", "Bash"]

  - id: "lan-mem-distillatore"
    grado: "sentinella"
    modello: "claude-sonnet-5"
    produce: ["ART-DBR"]
    ruolo: "confronta previsione e realta', scrive le cause, distilla gli schemi"
    tools: ["Read", "Write", "Glob", "Grep"]

# -----------------------------------------------------------------------------
# 7. IL PONTE — come un programma fa lavorare un agente
# -----------------------------------------------------------------------------
# Verificato sulla macchina: il meccanismo esiste e funziona, ma nessuno script
# dell'azienda lo usa ancora. Le regole qui sotto NON sono nuove: sono le lezioni
# gia' pagate da ADR-014 (2026-08-30), che la versione precedente del piano non
# citava mai pur poggiando interamente sugli agenti.
ponte:
  meccanismo: "claude -p --agent <id> --output-format json"
  regole_ereditate_da_adr_014:
    - regola: "il prompt si passa da standard input, mai come argomento"
      perche: "il wrapper troncava i prompt multiriga alla prima riga, in silenzio"
    - regola: "si passa l'identificativo esplicito del modello, mai l'alias"
      perche: "--model sonnet restituiva claude-sonnet-4-6: l'alias mente e si paga un altro modello"
    - regola: "si legge total_cost_usd dalla risposta e si verifica il budget PRIMA di ogni chiamata"
      perche: "il tetto di spesa e' stato sfondato in silenzio una volta"
    - regola: "si lavora a blocchi, non a unita' minima"
      perche: "ogni invocazione costa ~0,08-0,11 $ di sola tassa, indipendentemente dal contenuto"
  tetto_spesa_per_lancio_usd: 15.00
  comportamento_al_tetto: "il lancio si ferma dove e', salvato; non si ricomincia, si riprende"

# -----------------------------------------------------------------------------
# 8. GLI INVARIANTI — cio' che valida_registro.py verifica prima di ogni build
# -----------------------------------------------------------------------------
# Un invariante e' una cosa che deve essere sempre vera. Se uno solo di questi
# e' falso, il piano e' incoerente e non si costruisce.
invarianti:

  - id: "INV-01"
    dice: "per ogni artefatto, giudice != produttore"
    perche: >-
      nella versione precedente cinque gate su sette del flusso Prodotto erano
      eseguiti dallo stesso agente che aveva prodotto la cosa giudicata, violando
      una regola scritta dieci righe sopra. Una regola che un programma non
      controlla e' un'opinione.

  - id: "INV-02"
    dice: "ogni artefatto ha uno schema esistente in dati/schemi/"
    perche: "nove artefatti su tredici erano dichiarati 'un file JSON' senza schema"

  - id: "INV-03"
    dice: "ogni gate ha ramo_fallimento non vuoto e uno stato di destinazione valido"
    perche: "nessuno dei gate della versione precedente diceva cosa succede quando boccia"

  - id: "INV-04"
    dice: "ogni gate ha un test_rosso dichiarato"
    perche: "un gate senza un caso che lo faccia fallire e' decorativo per costruzione"

  - id: "INV-05"
    dice: "ogni sigla usata in qualunque campo appartiene all'elenco degli id definiti qui"
    perche: >-
      la versione precedente usava sei sigle di reparto in un dossier che non
      esistevano nell'altro, e sette nomi di gate senza mappa verso i tre nomi
      ufficiali. Il documento operativo non era installabile sopra quello di governo.

  - id: "INV-06"
    dice: "ogni punto umano ha scadenza_giorni oppure una motivazione esplicita per non averla"
    perche: "il punto su cui l'azienda si e' fermata sei mesi era l'unico senza scadenza"

  - id: "INV-07"
    dice: "il nucleo minimo di agenti copre tutti i produttori degli artefatti da ART-PUB a ART-DBR"
    perche: >-
      lo scaglione minimo della versione precedente, anche dopo la correzione, non
      conteneva i produttori di tre artefatti necessari: il primo lancio si sarebbe
      fermato alla prima fase.

  - id: "INV-08"
    dice: "nessun agente con grado scagnozzo produce un artefatto che richiede giudizio"
    perche: "il grado deve corrispondere alla natura del lavoro, non alla sua importanza"

  - id: "INV-09"
    dice: "l'agente lan-gate non ha Write ne' Edit fra i propri tools"
    perche: "un giudice che puo' riscrivere cio' che giudica non e' un giudice"

  - id: "INV-10"
    dice: "ogni artefatto con umano=true dichiara il nome del campo firma obbligatorio"
    perche: "una firma senza canale e senza legame col testo firmato e' una stringa qualunque"

  - id: "INV-13"
    dice: "ogni artefatto appartiene a UN SOLO reparto, e ogni reparto operativo possiede almeno un artefatto"
    perche: >-
      nella versione precedente i dodici reparti erano etichette: nessuno di essi
      possedeva un file con uno schema, quindi due reparti potevano credere di
      possedere la stessa cosa e nessuno la produceva. Un reparto che non possiede
      un artefatto non e' un organo: e' un titolo.

  - id: "INV-14"
    dice: "ogni agente appartiene a un reparto esistente, e ogni reparto ha un capo che e' un suo agente"
    perche: >-
      un agente senza reparto non ha nessuno a cui rispondere, e un reparto senza
      capo non ha nessuno che risponda per lui quando un gate boccia.

  - id: "INV-15"
    dice: "la catena di comando non ha cicli: nessun reparto risponde, per catena, a se stesso"
    perche: >-
      un anello nella gerarchia significa che nessuno decide. Si verifica con lo
      stesso metodo del grafo delle dipendenze fra artefatti.

  - id: "INV-16"
    dice: "il reparto che giudica (LAN-QLT) non risponde a nessun reparto operativo: risponde solo alla Direzione"
    perche: >-
      un giudice che risponde a chi giudica non e' un giudice. E' il gemello
      gerarchico di INV-09, che gli toglie la penna: questo gli toglie il padrone.
      Togliergliene una sola lascia intatto il modo di aggirarlo.

  - id: "INV-17"
    dice: "ogni workflow produce artefatti esistenti, e ogni artefatto e' prodotto da esattamente un workflow"
    perche: >-
      due workflow che producono la stessa cosa sono due verita' in conflitto; un
      artefatto senza workflow e' un file che nessuno sa come si fa.

  - id: "INV-18"
    dice: "ogni fase di ogni workflow ha un agente esistente, un ingresso, un'uscita e un criterio di uscita"
    perche: >-
      la versione precedente aveva flussi con fasi senza agente e fasi senza
      criterio: erano elenchi di buone intenzioni in ordine cronologico. Una fase
      senza criterio di uscita non finisce, smette quando qualcuno si stanca.

  - id: "INV-19"
    dice: "l'agente di ogni fase appartiene al reparto proprietario del workflow, oppure la fase dichiara reparto_ospite"
    perche: >-
      senza questo vincolo un reparto puo' far lavorare gli agenti di un altro
      senza che nessuno lo sappia, ed e' il modo in cui le responsabilita'
      evaporano: il lavoro risulta fatto, ma nessuno ne risponde.

  - id: "INV-20"
    dice: "ogni passaggio di consegne cita due reparti esistenti, un artefatto esistente e un criterio di accettazione"
    perche: >-
      un passaggio senza criterio di accettazione e' una speranza: chi riceve
      scopre che manca qualcosa quando e' gia' al lavoro, e torna indietro.

  - id: "INV-21"
    dice: "ogni comando dichiara da quale livello della gerarchia puo' essere invocato, e quel livello esiste"
    perche: >-
      un comando che chiunque puo' invocare e' un comando senza responsabile.
      Vale soprattutto per i tre che impegnano cose irreversibili: la firma sul
      prezzo, il via libera all'apertura, l'abbandono di un lancio.

  - id: "INV-22"
    dice: "il campo produce di ogni agente coincide con gli artefatti di cui e' davvero il produttore"
    perche: >-
      trovato da una prova rossa mal costruita il 2026-09-05: la prova aveva
      alterato il campo produce di un agente invece di quello di un workflow, e
      NESSUN controllo se n'era accorto. Sono due punti che dicono la stessa cosa
      e potevano divergere in silenzio — cioe' esattamente la famiglia di difetto
      per cui questo registro esiste. L'errore di una prova ha trovato un buco
      vero: e' la ragione per cui le prove rosse si fanno.

# =============================================================================
# 9. I REPARTI — organi veri, ancorati agli artefatti che possiedono
# =============================================================================
# LA DIFFERENZA CON LA VERSIONE PRECEDENTE, che aveva dodici reparti e li ha
# persi tutti alla revisione: li' il reparto era un NOME in un organigramma,
# ricopiato a mano in undici documenti (sei sigle esistevano in un dossier e non
# nell'altro). Qui un reparto esiste se e solo se POSSIEDE un artefatto con uno
# schema, e INV-13 lo verifica. Un reparto che non possiede niente non e' un
# organo: e' un titolo.
#
#   possiede      gli artefatti di cui e' l'unico proprietario di scrittura
#   capo          l'agente che risponde per il reparto quando un gate boccia
#   agenti        tutti gli agenti del reparto
#   risponde_a    il reparto sopra di lui nella catena di comando
#   workflow      il flusso di lavoro che esegue
#   confine       cio' che NON fa, e chi lo fa al posto suo
reparti:

  # ------------------------------------------------------------------ governo
  - id: "LAN-DIR"
    nome: "Direzione"
    tipo: "governo"
    missione: "porta un lancio da IDEA ad APPRESO e risponde a Max di cosa e' successo"
    possiede: []
    capo: "lan-direttore"
    agenti: ["lan-direttore"]
    risponde_a: null
    workflow: null
    confine: >-
      non produce nessun artefatto e non giudica nessun artefatto: se lo facesse
      sarebbe parte in causa nei conflitti che deve arbitrare.

  - id: "LAN-QLT"
    nome: "Qualita'"
    tipo: "governo"
    missione: "esegue tutti i controlli e scrive i verbali, anche quando lasciano passare"
    possiede: []
    capo: "lan-gate"
    agenti: ["lan-gate"]
    risponde_a: "LAN-DIR"
    workflow: null
    confine: >-
      non produce nessun artefatto (INV-01) e non ha permesso di scrittura
      (INV-09). Non risponde a nessun reparto operativo (INV-16).

  # ---------------------------------------------------------------- operativi
  - id: "LAN-MER"
    nome: "Mercato"
    tipo: "operativo"
    missione: "sa quante persone possiamo mettere davanti all'offerta e con quali parole parlano"
    possiede: ["ART-PUB", "ART-RIC"]
    capo: "lan-pub-censore"
    agenti: ["lan-pub-censore", "lan-int-analista"]
    risponde_a: "LAN-DIR"
    workflow: "WF-MERCATO"
    confine: >-
      non costruisce pubblico e non fa campagne: conta cio' che c'e' e porta la
      prova di ogni numero. Costruire pubblico e' lavoro di 04-MARKETING.
    perche_uniti: >-
      pubblico e ricerca rispondono alla stessa domanda — chi c'e' la' fuori e
      cosa dice — e attingono alle stesse fonti. Separarli avrebbe prodotto due
      reparti da un agente ciascuno, cioe' due titoli.

  - id: "LAN-STR"
    nome: "Strategia"
    tipo: "operativo"
    missione: "decide se questo lancio si fa adesso, e non un altro"
    possiede: ["ART-DEC"]
    capo: "lan-str-filtro"
    agenti: ["lan-str-filtro"]
    risponde_a: "LAN-DIR"
    workflow: "WF-STRATEGIA"
    confine: >-
      non sceglie il prezzo e non sceglie la data: sono dell'Offerta. Qui si
      decide solo se vale la pena istruire il lancio.

  - id: "LAN-PRD"
    nome: "Prodotto"
    tipo: "operativo"
    missione: "certifica che il prodotto e' consegnabile a un cliente pagante senza vergogna e senza rischio"
    possiede: ["ART-CRT"]
    capo: "lan-prd-collaudatore"
    agenti: ["lan-prd-collaudatore"]
    risponde_a: "LAN-DIR"
    workflow: "WF-PRODOTTO"
    confine: >-
      non crea il prodotto: e' di 02-INFO-BUSINESS. Qui si collauda cio' che
      arriva gia' fatto, anche in modalita' retroattiva.

  - id: "LAN-OFF"
    nome: "Offerta"
    tipo: "operativo"
    missione: "istruisce prezzo e data fino a renderli una conferma di dieci secondi"
    possiede: ["ART-PRV", "ART-OFF"]
    capo: "lan-off-conductor"
    agenti: ["lan-off-conductor", "lan-prv-modello"]
    risponde_a: "LAN-DIR"
    workflow: "WF-OFFERTA"
    confine: >-
      non firma. La firma e' di una persona, per canale ammesso, e nessun agente
      di questo reparto ha permesso di scrittura sul campo firma.
    perche_uniti: >-
      la previsione esiste per rendere la firma del prezzo una decisione invece
      che una scelta di gusto: sono due meta' dello stesso atto. Tenerle in due
      reparti avrebbe rifatto il difetto della versione precedente, dove il prezzo
      si sceglieva senza sapere quanto produceva.

  - id: "LAN-CPY"
    nome: "Parola"
    tipo: "operativo"
    missione: "tutti i testi del lancio, ognuno col punteggio calcolato e la destinazione"
    possiede: ["ART-CPY"]
    capo: "lan-cpy-conductor"
    agenti: ["lan-cpy-conductor"]
    risponde_a: "LAN-DIR"
    workflow: "WF-PAROLA"
    confine: >-
      non possiede lo standard dei testi ne' la voce del marchio: sono di
      04-MARKETING e si ricevono come vincolo, non si ridiscutono qui.

  - id: "LAN-FNL"
    nome: "Vendita"
    tipo: "operativo"
    missione: "le pagine sono online, misurano, e la cassa ha incassato un pagamento vero"
    possiede: ["ART-FNL"]
    capo: "lan-fnl-costruttore"
    agenti: ["lan-fnl-costruttore"]
    risponde_a: "LAN-DIR"
    workflow: "WF-VENDITA"
    confine: >-
      non decide cosa dicono le pagine (e' della Parola) e non porta traffico
      (e' dell'Editoriale e di 04-MARKETING). Qui si costruisce e si prova che
      incassa.

  - id: "LAN-EDT"
    nome: "Editoriale"
    tipo: "operativo"
    missione: "riempie i giorni del lancio di contenuti che escono davvero e portano da qualche parte"
    possiede: ["ART-EDT"]
    capo: "lan-edt-pianificatore"
    agenti: ["lan-edt-pianificatore"]
    risponde_a: "LAN-DIR"
    workflow: "WF-EDITORIALE"
    confine: >-
      non spedisce niente da solo: ogni invio reale alla lista e' un punto umano
      (PU-INVIO), perche' un'email spedita non si richiama.

  - id: "LAN-TSR"
    nome: "Tesoro"
    tipo: "operativo"
    missione: "sa quanto costa il lancio, quanto costa farlo girare, e a quante copie va in pari"
    possiede: ["ART-BDG"]
    capo: "lan-tsr-contabile"
    agenti: ["lan-tsr-contabile"]
    risponde_a: "LAN-DIR"
    workflow: "WF-TESORO"
    confine: >-
      non e' la Tesoreria dell'azienda (ecosistema 14): qui si governa il costo di
      UN lancio. Se un numero compare in tutti e due i posti ed e' diverso, ha
      ragione la Tesoreria.

  - id: "LAN-REG"
    nome: "Regia"
    tipo: "operativo"
    missione: "porta il lancio all'apertura con tutte le condizioni vere insieme, e ne misura il risultato"
    possiede: ["ART-APE", "ART-CNS"]
    capo: "lan-reg-calendarista"
    agenti: ["lan-reg-calendarista", "lan-reg-tracciatore"]
    risponde_a: "LAN-DIR"
    workflow: "WF-REGIA"
    confine: >-
      non apre la vendita: il via libera e' di una persona e non avra' mai un
      default, perche' e' irreversibile verso l'esterno.
    perche_uniti: >-
      chi porta all'apertura e chi misura cosa e' successo devono essere lo stesso
      organo, altrimenti il consuntivo lo scrive qualcuno che non sa cosa era
      stato promesso il giorno dell'apertura.

  - id: "LAN-MEM"
    nome: "Memoria"
    tipo: "operativo"
    missione: "trasforma un lancio finito in vantaggio per il prossimo"
    possiede: ["ART-DBR"]
    capo: "lan-mem-distillatore"
    agenti: ["lan-mem-distillatore"]
    risponde_a: "LAN-DIR"
    workflow: "WF-MEMORIA"
    confine: >-
      non giudica le persone e non riscrive la storia: confronta previsione e
      realta', scrive le cause degli scarti, e la Regia controfirma. Se i due non
      sono d'accordo, l'obiezione resta scritta accanto.

# =============================================================================
# 10. LA GERARCHIA — chi comanda chi, e chi puo' attivare chi
# =============================================================================
# Cinque livelli. La regola che li tiene insieme: UN LIVELLO PUO' ATTIVARE SOLO
# IL LIVELLO SOTTO. Un agente che puo' attivare chiunque produce spesa non
# prevista e nessuna catena di responsabilita': e' il modo in cui un lancio
# consuma il tetto di quindici dollari senza che nessuno sappia chi ha chiamato
# cosa.
gerarchia:

  livelli:
    - id: "L0"
      chi: "Max"
      natura: "persona"
      decide: >-
        tutto cio' che e' irreversibile verso l'esterno (apertura della vendita,
        invii reali, spese oltre il tetto), il prezzo, e l'abbandono di un lancio
      puo_attivare: ["L1"]
      non_delegabile: true

    - id: "L1"
      chi: "LAN-DIR"
      natura: "governo"
      decide: "l'ordine del lavoro, quale reparto attivare, quando fermarsi"
      puo_attivare: ["L2", "LQ"]
      non_delegabile: false

    - id: "L2"
      chi: "i capi dei nove reparti operativi"
      natura: "capi reparto"
      decide: "come il proprio reparto produce il proprio artefatto"
      puo_attivare: ["L3"]
      non_delegabile: false

    - id: "L3"
      chi: "gli agenti esecutori"
      natura: "esecutori"
      decide: "niente: eseguono una fase e restituiscono un risultato tipizzato"
      puo_attivare: []
      non_delegabile: false

    - id: "LQ"
      chi: "LAN-QLT"
      natura: "giudizio, fuori dalla catena operativa"
      decide: "se un artefatto passa o blocca"
      puo_attivare: []
      non_delegabile: false
      nota: >-
        sta FUORI dalla scala L1-L3 di proposito. Non risponde ai reparti che
        giudica (INV-16) e non ha permesso di scrittura (INV-09). Gli si toglie
        insieme il padrone e la penna: togliergliene una sola lascia intatto il
        modo di aggirarlo.

  regole:
    - regola: "un livello attiva solo il livello sotto"
      perche: "senza, si perdono insieme la spesa e la responsabilita'"
    - regola: "nessun reparto attiva il giudice per farsi approvare"
      perche: >-
        il giudice lo invoca il comando `avanza`, mai un reparto. Se lo invocasse
        il reparto, sceglierebbe quando farsi giudicare.
    - regola: "un capo reparto non attiva agenti di un altro reparto"
      perche: "INV-19: le responsabilita' evaporano quando il lavoro attraversa i confini in silenzio"
    - regola: "solo L0 autorizza cio' che e' irreversibile verso l'esterno"
      perche: "un'email spedita non si richiama, una vendita aperta non si chiude in silenzio"

# =============================================================================
# 11. I WORKFLOW — come si svolge il lavoro, fase per fase
# =============================================================================
# IL DIFETTO CHE RIPARANO. La versione precedente aveva sette flussi, e i
# revisori li hanno smontati tutti per lo stesso motivo: fasi senza agente, fasi
# senza criterio di uscita, e un flusso (il funnel) che non aveva ne' l'uno ne'
# l'altro. Un elenco di buone intenzioni in ordine cronologico non e' un
# workflow: e' un promemoria.
#
# Qui ogni fase dichiara, obbligatoriamente:
#   agente            chi la esegue — e deve appartenere al reparto (INV-19)
#   ingresso          cosa deve esistere prima, o la fase non parte
#   uscita            cosa lascia sul disco quando finisce
#   criterio_uscita   il predicato che dice che e' finita. Non "quando e' pronta"
#   modi_fallimento   come puo' andare storta, e cosa si fa
#
# La differenza fra "fase" e "gate": la fase PRODUCE, il gate GIUDICA. Nessun
# workflow contiene il proprio gate fra le fasi, perche' un flusso che si
# autogiudica non e' giudicato (INV-01).
workflow:

  # ---------------------------------------------------------------------------
  - id: "WF-MERCATO"
    reparto: "LAN-MER"
    produce: ["ART-PUB", "ART-RIC"]
    innesco: "un lancio entra in IDEA"
    stato_da: "IDEA"
    stato_a: "VALUTATO"
    gate_finale: ["GATE-PUB-1", "GATE-INT-1"]
    durata_stimata_h: "3-6"
    perche_e_il_primo: >-
      perche' il piano precedente progettava il lancio di un prodotto il cui
      canale di traffico era spento da cinque settimane, e non lo sapeva. Prima
      di ogni altra cosa si conta chi c'e' davvero.
    fasi:
      - id: "ME-1"
        nome: "censimento dei canali"
        agente: "lan-pub-censore"
        ingresso: "l'elenco dei canali dell'azienda"
        uscita: "pubblico.json, sezione canali[], una riga per canale"
        criterio_uscita: "ogni canale noto compare, anche quelli a zero"
        modi_fallimento:
          - caso: "un canale non e' accessibile"
            allora: "si scrive raggiungibili_verificati=0 con prova.tipo=null e il motivo"

      - id: "ME-2"
        nome: "prova di ogni numero"
        agente: "lan-pub-censore"
        ingresso: "pubblico.json con i canali elencati"
        uscita: "ogni canale con prova.tipo e prova.data"
        criterio_uscita: >-
          ogni canale con raggiungibili_verificati>0 ha una prova fra
          esporto-lista, schermata-conteggio-piattaforma, misura-analytics, con
          data non anteriore a 30 giorni
        modi_fallimento:
          - caso: "il numero e' noto ma la prova non e' recuperabile"
            allora: "il canale vale zero. E' legittimo scrivere che non si sa; non lo e' contare cio' che non si sa"

      - id: "ME-3"
        nome: "verifica dei canali morti"
        agente: "lan-pub-censore"
        ingresso: "i canali dichiarati attivi"
        uscita: "campo stato_canale per ognuno"
        criterio_uscita: "ogni canale attivo ha una attivita' registrata negli ultimi 90 giorni, oppure e' marcato dormiente"
        modi_fallimento:
          - caso: "il canale e' stato dirottato su un altro progetto"
            allora: "vale zero e la cosa entra nel verbale. E' esattamente cio' che e' successo al canale del Manuale il 29/07/2026"

      - id: "ME-4"
        nome: "raccolta delle parole vere"
        agente: "lan-int-analista"
        ingresso: "il prodotto e il pubblico censito"
        uscita: "ricerca.json, sezione frasi[]"
        criterio_uscita: "almeno 15 frasi, ognuna con fonte.url"
        modi_fallimento:
          - caso: "non si arriva a 15 frasi con fonte"
            allora: "si consegna quello che c'e' e il gate blocca: meglio un blocco visibile di quindici frasi inventate"

      - id: "ME-5"
        nome: "buchi dei concorrenti"
        agente: "lan-int-analista"
        ingresso: "l'elenco dei concorrenti noti"
        uscita: "ricerca.json, sezione concorrenti[]"
        criterio_uscita: "ogni concorrente ha almeno un buco dichiarato con la fonte che lo mostra"
        modi_fallimento:
          - caso: "nessun concorrente identificabile"
            allora: "si dichiara e si prosegue: l'assenza di concorrenti e' un dato, spesso cattivo"
        reparto_ospite: null

  # ---------------------------------------------------------------------------
  - id: "WF-STRATEGIA"
    reparto: "LAN-STR"
    produce: ["ART-DEC"]
    innesco: "GATE-PUB-1 e' passato"
    stato_da: "IDEA"
    stato_a: "VALUTATO"
    gate_finale: ["GATE-STR-1"]
    durata_stimata_h: "1-2"
    fasi:
      - id: "ST-1"
        nome: "le cinque domande"
        agente: "lan-str-filtro"
        ingresso: "ART-PUB valido, il prodotto proposto"
        uscita: "decisione.json, sezione domande[]"
        criterio_uscita: "tutte e cinque hanno risposta si oppure no, e ognuna cita l'artefatto che la sostiene"
        modi_fallimento:
          - caso: "una domanda non ha un artefatto che la sostenga"
            allora: "la risposta e' no. Una risposta senza prova vale come negativa, non come dubbio"

      - id: "ST-2"
        nome: "confronto con i lanci in coda"
        agente: "lan-str-filtro"
        ingresso: "l'elenco dei lanci non chiusi"
        uscita: "decisione.json, campo perche_questo_e_non_un_altro"
        criterio_uscita: "il campo nomina almeno un lancio alternativo e dice perche' viene dopo"
        modi_fallimento:
          - caso: "non ci sono alternative in coda"
            allora: "si dichiara: e' il caso normale del primo lancio"

  # ---------------------------------------------------------------------------
  - id: "WF-PRODOTTO"
    reparto: "LAN-PRD"
    produce: ["ART-CRT"]
    innesco: "il lancio e' VALUTATO"
    stato_da: "VALUTATO"
    stato_a: "ISTRUITO"
    gate_finale: ["GATE-PRD-1"]
    durata_stimata_h: "2-4 integrale, 1-2 retroattiva"
    fasi:
      - id: "PR-1"
        nome: "scelta della modalita'"
        agente: "lan-prd-collaudatore"
        ingresso: "il prodotto e la sua storia"
        uscita: "certificato.json, campo modalita'"
        criterio_uscita: "modalita' vale integrale oppure retroattiva, e la scelta e' motivata"
        modi_fallimento:
          - caso: "il prodotto e' nato fuori dal sistema e non ha brief"
            allora: >-
              modalita' retroattiva. E' il percorso costruito per il Manuale, pronto
              dal 07/03/2026: senza, il flusso usciva con errore alla prima riga
              proprio sul prodotto per cui il reparto esiste

      - id: "PR-2"
        nome: "le sei bandiere rosse"
        agente: "lan-prd-collaudatore"
        ingresso: "il file del prodotto"
        uscita: "certificato.json, sezione bandiere_rosse[]"
        criterio_uscita: "tutte e sei hanno esito booleano e chi risulta presente ha la prova allegata"
        modi_fallimento:
          - caso: "una bandiera e' presente"
            allora: "il gate blocca e il lancio torna a VALUTATO con l'elenco di cosa manca"

      - id: "PR-3"
        nome: "prova dei collegamenti"
        agente: "lan-prd-collaudatore"
        ingresso: "l'elenco dei collegamenti dentro il prodotto"
        uscita: "certificato.json, sezione link[] con esito"
        criterio_uscita: "ogni collegamento e' stato aperto e ha un esito registrato"
        modi_fallimento:
          - caso: "un collegamento e' morto"
            allora: "il gate blocca. La verifica la rifa' il gate, non il produttore"

      - id: "PR-4"
        nome: "dichiarazione del debito di collaudo"
        agente: "lan-prd-collaudatore"
        ingresso: "la modalita' scelta"
        uscita: "certificato.json, campo debito_collaudo"
        criterio_uscita: "in modalita' retroattiva il campo elenca cosa non e' stato verificato e perche'"
        modi_fallimento:
          - caso: "si e' tentati di lasciarlo vuoto per far passare il gate"
            allora: "il gate blocca: in retroattiva il debito e' obbligatorio, anche se e' 'nessuno'"

  # ---------------------------------------------------------------------------
  - id: "WF-OFFERTA"
    reparto: "LAN-OFF"
    produce: ["ART-PRV", "ART-OFF"]
    innesco: "ART-CRT e ART-RIC sono validi"
    stato_da: "ISTRUITO"
    stato_a: "DATATO"
    gate_finale: ["GATE-PRV-1", "GATE-OFF-1"]
    durata_stimata_h: "3-5 piu' il tempo della firma"
    e_il_cuore: >-
      e' il flusso per cui l'intero ecosistema esiste: produce i due numeri che
      l'azienda non riesce a produrre da sei mesi, un prezzo e una data.
    fasi:
      - id: "O1"
        nome: "il ruolo del prodotto"
        agente: "lan-off-conductor"
        ingresso: "ART-CRT valido"
        uscita: "offerta.json, campo ruolo_prodotto"
        criterio_uscita: "il campo vale vendita oppure acquisizione-contatti"
        punto_umano: "PU-RUOLO"
        modi_fallimento:
          - caso: "la persona non risponde entro 7 giorni"
            allora: >-
              si procede col default vendita, si scrive ruolo_scelto_per_silenzio
              e la data di revisione, e si avvisa. Il default e' vendita perche' e'
              la strada da cui si torna indietro

      - id: "O2"
        nome: "riconciliazione dei prezzi gia' dati"
        agente: "lan-off-conductor"
        ingresso: "catalogo prodotti, wiki, listino, piani precedenti"
        uscita: "offerta.json, sezione prezzi_precedenti_trovati[]"
        criterio_uscita: "ogni fonte trovata e' nell'elenco con valore e data"
        modi_fallimento:
          - caso: "le fonti si contraddicono"
            allora: >-
              e' il caso normale: per il Manuale sono quattro valori diversi mai
              messi sullo stesso tavolo. Si elencano tutte e si dichiara perche' ci
              si discosta

      - id: "O3"
        nome: "struttura dell'offerta"
        agente: "lan-off-conductor"
        ingresso: "ART-CRT, ART-RIC"
        uscita: "offerta.json, sezione struttura"
        criterio_uscita: >-
          valore_dichiarato e' la somma dei soli bonus con fonte_valore diversa da
          null piu' il valore del prodotto, la garanzia ha almeno 14 giorni, e
          l'azione richiesta e' una sola
        modi_fallimento:
          - caso: "il rapporto valore/prezzo non raggiunge la soglia"
            allora: >-
              NON si aggiungono bonus senza fonte. Un bonus senza fonte vale zero
              nel calcolo: nella versione precedente il controllo istruiva a gonfiare

      - id: "O4"
        nome: "alternative di prezzo con il ricavo di ciascuna"
        agente: "lan-prv-modello"
        ingresso: "ART-PUB valido, la struttura dell'offerta"
        uscita: "previsione.json completo, e offerta.json sezione confronto_alternative_prezzo[]"
        criterio_uscita: >-
          almeno tre prezzi hanno un ricavo atteso calcolato con la formula
          dichiarata, i tre scenari esistono, e ogni assunzione ha stato misurato
          oppure assunto
        modi_fallimento:
          - caso: "un tasso e' dichiarato misurato senza fonte"
            allora: "GATE-PRV-1 blocca. E' il test rosso di quel gate"

      - id: "O5"
        nome: "la proposta e la firma"
        agente: "lan-off-conductor"
        ingresso: "previsione.json valido"
        uscita: "il testo della proposta, e la sua impronta"
        criterio_uscita: >-
          esiste una proposta di cinque righe che dice prezzo, data, ricavo atteso,
          pareggio e caso pessimista, e ne e' stata calcolata l'impronta
        punto_umano: "PU-PREZZO"
        modi_fallimento:
          - caso: "la persona non risponde entro 14 giorni"
            allora: >-
              il lancio va in SOSPESO con la data di revisione e il comando per
              uscirne. Qui NON c'e' default, ed e' deliberato: un prezzo scelto da
              una macchina produce un danno che si scopre a lancio finito
          - caso: "un agente prova a scrivere il campo firma"
            allora: >-
              il campo e' rifiutato: nessun agente ha permesso di scrittura su
              firma, e il canale deve essere in lista chiusa

      - id: "O6"
        nome: "congelamento"
        agente: "lan-off-conductor"
        ingresso: "offerta.json con firma valida"
        uscita: "data_chiusura calcolata, lancio in DATATO"
        criterio_uscita: "GATE-OFF-1 esce 0 e la data di chiusura e' coerente con apertura piu' durata"
        modi_fallimento:
          - caso: "la proposta e' stata rigenerata dopo la firma"
            allora: "l'impronta non corrisponde, la firma decade, O5 si riapre"

  # ---------------------------------------------------------------------------
  - id: "WF-PAROLA"
    reparto: "LAN-CPY"
    produce: ["ART-CPY"]
    innesco: "il lancio e' DATATO: esistono un prezzo e una data firmati"
    stato_da: "DATATO"
    stato_a: "IN_PRODUZIONE"
    gate_finale: ["GATE-CPY-1"]
    durata_stimata_h: "8-14"
    perche_dopo_l_offerta: >-
      perche' ogni testo dice un prezzo e una data. Nella versione precedente i
      testi si scrivevano prima, e un cambio di prezzo non invalidava niente:
      restavano online pagine che promettevano un numero diverso da quello vero.
    fasi:
      - id: "PA-1"
        nome: "inventario dei pezzi"
        agente: "lan-cpy-conductor"
        ingresso: "ART-OFF firmato, ART-FNL se gia' esiste"
        uscita: "copy/manifest.json, sezione pezzi[] con destinazione"
        criterio_uscita: "ogni pezzo ha una destinazione risolvibile e un tipo"
        modi_fallimento:
          - caso: "un pezzo non ha destinazione"
            allora: "non si scrive. Un testo senza posto dove andare e' lavoro buttato"

      - id: "PA-2"
        nome: "raccolta delle prove"
        agente: "lan-cpy-conductor"
        ingresso: "ART-CRT, ART-RIC"
        uscita: "l'elenco delle affermazioni dimostrabili, con il riferimento"
        criterio_uscita: "ogni affermazione di categoria prova ha un riferimento risolvibile fuori dal testo stesso"
        modi_fallimento:
          - caso: "una prova non esiste"
            allora: >-
              l'affermazione si toglie o si declassa a opinione. Non si scrive un
              numero che non si puo' mostrare: il gate lo risolve contro ART-CRT e
              ART-RIC, non contro il testo

      - id: "PA-3"
        nome: "scrittura dei pezzi"
        agente: "lan-cpy-conductor"
        ingresso: "inventario e prove"
        uscita: "i file di testo dentro copy/"
        criterio_uscita: "ogni pezzo dell'inventario esiste come file non vuoto"
        modi_fallimento:
          - caso: "un pezzo richiede una copertina"
            allora: >-
              si apre PU-COPERTINA: la copertina la fa Max, la macchina fornisce
              solo cartella aperta, titolo e due righe di brief. Il pezzo resta in
              attesa e compare fra cio' che blocca il lancio

      - id: "PA-4"
        nome: "punteggio"
        agente: "lan-cpy-conductor"
        ingresso: "i pezzi scritti"
        uscita: "copy/manifest.json, punteggio per blocco e totale"
        criterio_uscita: "ogni pezzo ha un punteggio per blocco calcolato con la griglia dichiarata"
        modi_fallimento:
          - caso: "il totale supera 80 ma un blocco sta sotto meta' dei suoi punti"
            allora: >-
              il gate blocca lo stesso. E' il test rosso di GATE-CPY-1: una media
              buona nasconde un pezzo rotto

      - id: "PA-5"
        nome: "coerenza con il prezzo firmato"
        agente: "lan-cpy-conductor"
        ingresso: "ART-OFF"
        uscita: "campo impronta_offerta in copy/manifest.json"
        criterio_uscita: "l'impronta dell'offerta usata coincide con quella dell'offerta corrente"
        modi_fallimento:
          - caso: "il prezzo e' cambiato dopo la scrittura"
            allora: "tutti i pezzi che lo citano diventano da_rivedere e il loro controllo si riapre"

  # ---------------------------------------------------------------------------
  - id: "WF-VENDITA"
    reparto: "LAN-FNL"
    produce: ["ART-FNL"]
    innesco: "esistono i testi approvati"
    stato_da: "IN_PRODUZIONE"
    stato_a: "IN_PRODUZIONE"
    gate_finale: ["GATE-FNL-1"]
    durata_stimata_h: "6-12"
    perche_prima_dell_apertura: >-
      perche' la versione precedente metteva la pubblicazione irreversibile prima
      della prova che il pagamento funzionasse. Qui si vende solo dopo che un euro
      vero e' entrato ed e' tornato indietro.
    fasi:
      - id: "VE-1"
        nome: "messa online delle pagine"
        agente: "lan-fnl-costruttore"
        ingresso: "ART-CPY approvato"
        uscita: "funnel.json, sezione pagine[] con indirizzo"
        criterio_uscita: "ogni pagina risponde 200 da una rete esterna"
        modi_fallimento:
          - caso: "una pagina non risponde"
            allora: "resta nell'elenco con l'esito, il gate blocca, le pagine buone restano"

      - id: "VE-2"
        nome: "installazione della misura"
        agente: "lan-fnl-costruttore"
        ingresso: "le pagine online"
        uscita: "funnel.json, evento_conversione per ogni pagina"
        criterio_uscita: "l'evento e' stato visto arrivare nello strumento di misura, con origine piattaforma"
        modi_fallimento:
          - caso: "l'evento non arriva"
            allora: >-
              il gate blocca. Non si accetta uno screenshot: la prova si legge
              dalla piattaforma, altrimenti il gate si fida di chi giudica

      - id: "VE-3"
        nome: "prova di cassa"
        agente: "lan-fnl-costruttore"
        ingresso: "la pagina di pagamento collegata"
        uscita: "funnel.json, sezione prova_cassa"
        criterio_uscita: >-
          prova_cassa.stato vale incassato_e_rimborsato e il riferimento della
          transazione e' presente e leggibile nel pannello del fornitore
        modi_fallimento:
          - caso: "il pagamento non va a buon fine"
            allora: >-
              il lancio non avanza. E' la condizione che nella versione precedente
              non esisteva, e che riguarda il difetto piu' grave trovato: l'azienda
              non puo' incassare un euro

      - id: "VE-4"
        nome: "quota di consenso alla misura"
        agente: "lan-fnl-costruttore"
        ingresso: "lo strumento di misura installato"
        uscita: "funnel.json, campo quota_consenso"
        criterio_uscita: "la quota e' un numero letto dallo strumento, oppure e' dichiarata sconosciuta"
        modi_fallimento:
          - caso: "la quota non e' misurabile"
            allora: >-
              si dichiara sconosciuta. Senza, ogni previsione tarata su quei numeri
              e' sbagliata di una quantita' nota e taciuta

  # ---------------------------------------------------------------------------
  - id: "WF-EDITORIALE"
    reparto: "LAN-EDT"
    produce: ["ART-EDT"]
    innesco: "esistono i testi e le pagine"
    stato_da: "IN_PRODUZIONE"
    stato_a: "IN_PRODUZIONE"
    gate_finale: ["GATE-EDT-1"]
    durata_stimata_h: "4-8"
    fasi:
      - id: "ED-1"
        nome: "calendario a ritroso dalla data di apertura"
        agente: "lan-edt-pianificatore"
        ingresso: "ART-OFF, data_apertura e durata_carrello_gg"
        uscita: "editoriale.json, sezione giorni[]"
        criterio_uscita: "ogni giorno fra oggi e la chiusura del carrello esiste come riga"
        modi_fallimento:
          - caso: "la data di apertura e' troppo vicina per il piano"
            allora: "si dichiara il numero di giorni mancanti e la Regia decide se spostare"

      - id: "ED-2"
        nome: "assegnazione dei contenuti"
        agente: "lan-edt-pianificatore"
        ingresso: "ART-CPY, i giorni del calendario"
        uscita: "ogni contenuto con giorno, canale e destinazione"
        criterio_uscita: "ogni giorno del carrello ha almeno un contenuto, e ogni contenuto punta a una pagina esistente in ART-FNL"
        modi_fallimento:
          - caso: "un contenuto punta a una pagina inesistente"
            allora: "il gate blocca. E' il test rosso di GATE-EDT-1"

      - id: "ED-3"
        nome: "marcatura degli invii reali"
        agente: "lan-edt-pianificatore"
        ingresso: "il piano assegnato"
        uscita: "campo richiede_autorizzazione su ogni riga di invio"
        criterio_uscita: "ogni riga che comporta un invio alla lista e' marcata come punto umano"
        punto_umano: "PU-INVIO"
        modi_fallimento:
          - caso: "l'autorizzazione non arriva"
            allora: "l'invio non parte. Un'email spedita non si richiama, e non avra' mai un default"

  # ---------------------------------------------------------------------------
  - id: "WF-TESORO"
    reparto: "LAN-TSR"
    produce: ["ART-BDG"]
    innesco: "il lancio e' DATATO"
    stato_da: "DATATO"
    stato_a: "IN_PRODUZIONE"
    gate_finale: ["GATE-TSR-1", "GATE-TSR-2"]
    durata_stimata_h: "2-4"
    fasi:
      - id: "TE-1"
        nome: "voci di costo"
        agente: "lan-tsr-contabile"
        ingresso: "il piano del lancio"
        uscita: "budget.json, sezione voci[]"
        criterio_uscita: "ogni voce ha importo, tipo e stato; le voci impegnate hanno chi le ha autorizzate"
        modi_fallimento:
          - caso: "una voce passa a impegnato senza autorizzazione"
            allora: "lo schema la rifiuta: impegnare denaro e' una decisione umana"

      - id: "TE-2"
        nome: "costo della macchina"
        agente: "lan-tsr-contabile"
        ingresso: "il numero di invocazioni previste per agente"
        uscita: "budget.json, campo costo_macchina_previsto"
        criterio_uscita: "il campo e' presente e maggiore di zero"
        modi_fallimento:
          - caso: "il campo manca"
            allora: >-
              GATE-TSR-1 blocca. E' il test rosso di quel gate, e ripara il difetto
              per cui la versione precedente prevedeva 41 agenti senza una riga sul
              costo

      - id: "TE-3"
        nome: "pareggio"
        agente: "lan-tsr-contabile"
        ingresso: "ART-PRV"
        uscita: "budget.json, sezione pareggio"
        criterio_uscita: "copie_per_pareggio e' calcolato da previsione.json, e lo scenario usato e' dichiarato"
        modi_fallimento:
          - caso: "manca la previsione"
            allora: >-
              il pareggio non si calcola e il gate blocca. Nella versione precedente
              il gate chiedeva un pareggio che nessun artefatto produceva: era
              insoddisfacibile per costruzione

      - id: "TE-4"
        nome: "sorveglianza dello scarto"
        agente: "lan-tsr-contabile"
        ingresso: "i movimenti registrati durante la produzione"
        uscita: "budget.json, sezione scarto_corrente"
        criterio_uscita: "lo scarto e' ricalcolato dai movimenti, mai dalla dichiarazione"
        tipo_fase: "continua"
        modi_fallimento:
          - caso: "lo scarto supera il dieci per cento"
            allora: >-
              la spesa nuova si blocca e il lancio torna a DATATO: non muore. Si
              sblocca solo con firma umana tracciata (PU-SPESA)

  # ---------------------------------------------------------------------------
  - id: "WF-REGIA"
    reparto: "LAN-REG"
    produce: ["ART-APE", "ART-CNS"]
    innesco: "testi, pagine, piano editoriale e budget sono tutti validi"
    stato_da: "IN_PRODUZIONE"
    stato_a: "CHIUSO"
    gate_finale: ["GATE-REG-1", "GATE-CNS-1"]
    durata_stimata_h: "3-5 piu' i giorni del carrello"
    fasi:
      - id: "RE-1"
        nome: "lista di sincronizzazione"
        agente: "lan-reg-calendarista"
        ingresso: "tutti gli artefatti da ART-PUB a ART-BDG"
        uscita: "apertura.json, sezione lista_sincronizzazione[]"
        criterio_uscita: >-
          ogni voce ha esito booleano, e la validita' di ogni artefatto e'
          ricalcolata dai file, mai letta dallo stato salvato
        modi_fallimento:
          - caso: "nove voci vere e una falsa"
            allora: >-
              il gate blocca e il lancio torna a IN_PRODUZIONE con l'elenco delle
              voci false. E' il test rosso di GATE-REG-1: una lista quasi completa
              non e' una lista completa

      - id: "RE-2"
        nome: "richiesta del via libera"
        agente: "lan-reg-calendarista"
        ingresso: "la lista tutta vera"
        uscita: "apertura.json, campo via_libera in attesa"
        criterio_uscita: "esiste una richiesta esplicita con tutto cio' che serve per decidere in una schermata"
        punto_umano: "PU-APERTURA"
        modi_fallimento:
          - caso: "il via libera non arriva"
            allora: >-
              il lancio resta in PRONTO, senza scadenza. Aprire una vendita e'
              irreversibile verso l'esterno: non ha e non avra' mai un default

      - id: "RE-3"
        nome: "apertura"
        agente: "lan-reg-calendarista"
        ingresso: "via_libera firmato per canale ammesso"
        uscita: "lancio in APERTO, data di apertura registrata"
        criterio_uscita: "GATE-REG-1 esce 0 e lo stato e' APERTO"
        modi_fallimento:
          - caso: "un gate rifiuta dopo la sincronizzazione"
            allora: "si torna a IN_PRODUZIONE: e' l'unica transizione autorizzata dal gate stesso"

      - id: "RE-4"
        nome: "misura quotidiana"
        agente: "lan-reg-tracciatore"
        ingresso: "il lancio aperto"
        uscita: "una riga al giorno con ordini e ricavo letti dai pannelli"
        criterio_uscita: "ogni giorno del carrello ha una riga con origine dichiarata"
        tipo_fase: "continua"
        modi_fallimento:
          - caso: "il fornitore di pagamento non risponde"
            allora: "codice 3, la riga resta mancante e dichiarata tale: non si stima"

      - id: "RE-5"
        nome: "consuntivo"
        agente: "lan-reg-tracciatore"
        ingresso: "le righe quotidiane, la chiusura del carrello"
        uscita: "consuntivo.json"
        criterio_uscita: >-
          ricavo_lordo ha origine fornitore-pagamento oppure esporto-piattaforma, il
          periodo copre tutte le date del carrello, e il numero di ordini e'
          coerente con ricavo diviso prezzo
        modi_fallimento:
          - caso: "il ricavo e' dichiarato a mano"
            allora: >-
              il gate blocca e il lancio resta APERTO finche' il consuntivo non ha
              un'origine verificabile. E' il test rosso di GATE-CNS-1

  # ---------------------------------------------------------------------------
  - id: "WF-MEMORIA"
    reparto: "LAN-MEM"
    produce: ["ART-DBR"]
    innesco: "il lancio e' CHIUSO e il consuntivo e' valido"
    stato_da: "CHIUSO"
    stato_a: "APPRESO"
    gate_finale: ["GATE-MEM-1"]
    durata_stimata_h: "2-4"
    perche_esiste: >-
      perche' senza, un lancio finito lascia solo un numero. Un numero senza
      confronto non insegna niente: si archivia e si ricomincia da zero al lancio
      dopo.
    fasi:
      - id: "MM-1"
        nome: "calcolo degli scarti"
        agente: "lan-mem-distillatore"
        ingresso: "ART-PRV e ART-CNS"
        uscita: "debrief.json, sezione scarti[]"
        criterio_uscita: "ogni voce prevista ha accanto la voce reale e la differenza in percentuale"
        modi_fallimento:
          - caso: "manca la previsione perche' il lancio e' vecchio"
            allora: "si dichiara e il debrief resta parziale, marcato come tale"

      - id: "MM-2"
        nome: "cause degli scarti"
        agente: "lan-mem-distillatore"
        ingresso: "gli scarti calcolati"
        uscita: "una causa scritta per ogni scarto oltre il dieci per cento"
        criterio_uscita: "nessuno scarto oltre soglia e' privo di causa"
        modi_fallimento:
          - caso: "la causa non si conosce"
            allora: >-
              si scrive 'non nota' e si dice quale misura sarebbe servita. E' un
              risultato utile: dice cosa installare prima del prossimo lancio

      - id: "MM-3"
        nome: "distillazione degli schemi"
        agente: "lan-mem-distillatore"
        ingresso: "cause e verbali del lancio"
        uscita: "debrief.json, sezione schemi[]"
        criterio_uscita: >-
          almeno tre schemi, ognuno con si_applica_quando non vuoto e un
          riferimento a un artefatto esistente sul disco
        modi_fallimento:
          - caso: "gli schemi sono generici"
            allora: >-
              il gate blocca: uno schema che si applica sempre non si applica mai.
              E' il test rosso di GATE-MEM-1

      - id: "MM-4"
        nome: "controfirma della Regia"
        agente: "lan-reg-calendarista"
        reparto_ospite: "LAN-REG"
        ingresso: "il debrief completo"
        uscita: "debrief.json, campo controfirma"
        criterio_uscita: "la Regia ha controfirmato, oppure ha lasciato scritta l'obiezione accanto"
        modi_fallimento:
          - caso: "Regia e Memoria non sono d'accordo"
            allora: >-
              l'obiezione resta scritta accanto invece di essere negoziata via.
              Nessuno dei due scrive da solo la storia di com'e' andata

# =============================================================================
# 12. I PASSAGGI DI CONSEGNE — chi consegna a chi, e quando e' accettato
# =============================================================================
# Un passaggio senza criterio di accettazione e' una speranza: chi riceve scopre
# che manca qualcosa quando e' gia' al lavoro, e torna indietro. INV-20 verifica
# che ognuno citi due reparti esistenti, un artefatto esistente e un criterio.
passaggi:

  - da: "LAN-MER"
    a: "LAN-STR"
    passa: "ART-PUB"
    criterio_accettazione: "il totale verificato e' un numero, e ogni canale che contribuisce ha una prova non piu' vecchia di 30 giorni"
    se_rifiutato: "torna a LAN-MER, il lancio resta in IDEA"

  - da: "LAN-MER"
    a: "LAN-OFF"
    passa: "ART-RIC"
    criterio_accettazione: "almeno 15 frasi con fonte apribile, e il campione riaperto dal gate risulta raggiungibile"
    se_rifiutato: "torna a LAN-MER, le frasi con fonte valida si conservano"

  - da: "LAN-STR"
    a: "LAN-PRD"
    passa: "ART-DEC"
    criterio_accettazione: "cinque risposte, nessuna negativa, ognuna con l'artefatto che la sostiene"
    se_rifiutato: "il lancio va in ARCHIVIATO con la ragione, e resta riproponibile con un elemento nuovo"

  - da: "LAN-PRD"
    a: "LAN-OFF"
    passa: "ART-CRT"
    criterio_accettazione: "nessuna bandiera rossa presente, link testati dal gate, e in modalita' retroattiva il debito di collaudo dichiarato"
    se_rifiutato: "torna a LAN-PRD, il lancio torna a VALUTATO con l'elenco di cosa manca"

  - da: "LAN-OFF"
    a: "LAN-CPY"
    passa: "ART-OFF"
    criterio_accettazione: "prezzo e data esistono, la firma ha canale ammesso e l'impronta corrisponde alla proposta corrente"
    se_rifiutato: "torna a LAN-OFF, la proposta si conserva e la fase O5 si riapre"

  - da: "LAN-OFF"
    a: "LAN-TSR"
    passa: "ART-PRV"
    criterio_accettazione: "i tre scenari esistono e ogni assunzione dichiara stato misurato oppure assunto"
    se_rifiutato: "torna a LAN-OFF, la previsione si conserva marcata non valida"

  - da: "LAN-CPY"
    a: "LAN-FNL"
    passa: "ART-CPY"
    criterio_accettazione: "punteggio totale almeno 80, nessun blocco sotto meta' dei propri punti, e ogni prova risolvibile"
    se_rifiutato: "torna a LAN-CPY, si rifanno solo i blocchi bocciati"

  - da: "LAN-CPY"
    a: "LAN-EDT"
    passa: "ART-CPY"
    criterio_accettazione: "ogni pezzo destinato a un contenuto editoriale esiste come file non vuoto"
    se_rifiutato: "torna a LAN-CPY con l'elenco dei pezzi mancanti"

  - da: "LAN-FNL"
    a: "LAN-REG"
    passa: "ART-FNL"
    criterio_accettazione: "ogni pagina risponde, l'evento e' arrivato dalla piattaforma, e la prova di cassa e' incassata e rimborsata"
    se_rifiutato: "torna a LAN-FNL, le pagine conformi restano"

  - da: "LAN-EDT"
    a: "LAN-REG"
    passa: "ART-EDT"
    criterio_accettazione: "nessuna riga incompleta, ogni contenuto punta a una pagina esistente, ogni giorno del carrello ha un contenuto"
    se_rifiutato: "torna a LAN-EDT con le righe incomplete evidenziate"

  - da: "LAN-TSR"
    a: "LAN-REG"
    passa: "ART-BDG"
    criterio_accettazione: "costo totale sotto il tetto, pareggio calcolato dalla previsione, costo macchina presente"
    se_rifiutato: "torna a LAN-TSR, il budget si conserva marcato oltre tetto"

  - da: "LAN-REG"
    a: "LAN-MEM"
    passa: "ART-CNS"
    criterio_accettazione: "il ricavo ha origine verificabile e il periodo copre tutte le date del carrello"
    se_rifiutato: "torna a LAN-REG, il lancio resta APERTO"

  - da: "LAN-MEM"
    a: "LAN-DIR"
    passa: "ART-DBR"
    criterio_accettazione: "ogni scarto oltre il dieci per cento ha una causa, almeno tre schemi con si_applica_quando, e la controfirma della Regia"
    se_rifiutato: "torna a LAN-MEM, il lancio resta CHIUSO e non diventa APPRESO"

  # --- verso l'esterno dell'ecosistema ---------------------------------------
  - da: "ULTIMO-METRO"
    a: "LAN-STR"
    passa: "l'elenco di cio' che e' pronto e non e' uscito"
    criterio_accettazione: "il prodotto esiste come file ed e' dichiarato pubblicabile"
    se_rifiutato: "resta in carico all'Ultimo Metro"
    esterno: true

  - da: "LAN-REG"
    a: "TESORERIA"
    passa: "ricavi e costi reali"
    criterio_accettazione: "ogni numero ha un'origine leggibile in un pannello"
    se_rifiutato: "il numero resta dichiarato non verificabile e la divergenza si registra"
    esterno: true
    nota: "ogni euro nasce qui e sale in Tesoreria, non scende mai. Se un numero diverge, ha ragione la Tesoreria"

# =============================================================================
# 13. I COMANDI — il repertorio, e chi puo' invocarli
# =============================================================================
comandi:

  - nome: "lancio crea <id> --prodotto <nome>"
    fa: "crea la cartella del lancio con stato.json in IDEA"
    invocabile_da: ["L0", "L1"]

  - nome: "lancio avanza <id>"
    fa: "fa avanzare il lancio finche' un controllo non lo ferma"
    invocabile_da: ["L0", "L1"]
    nota: "e' l'unico che invoca il giudice. Nessun reparto puo' farlo: sceglierebbe quando farsi giudicare"

  - nome: "lancio avanza <id> --solo-gate <GATE>"
    fa: "riesegue un solo controllo dopo una correzione"
    invocabile_da: ["L0", "L1", "L2"]

  - nome: "lancio avanza <id> --a-vuoto"
    fa: "calcola e stampa senza scrivere niente"
    invocabile_da: ["L0", "L1", "L2"]

  - nome: "lancio elenco"
    fa: "una riga per lancio, con da quanti giorni e' fermo e su cosa"
    invocabile_da: ["L0", "L1", "L2"]

  - nome: "lancio blocchi"
    fa: "tutti i punti umani aperti dell'azienda, ordinati per giorni di attesa"
    invocabile_da: ["L0", "L1", "L2"]
    nota: >-
      il comando piu' importante del sistema, e nella versione precedente non
      esisteva. Rende visibile il problema vero di questa azienda: non i lanci che
      vanno male, ma quelli che non partono perche' una decisione aspetta

  - nome: "lancio costi <id>"
    fa: "quanto e' costato finora, letto dal registro delle chiamate"
    invocabile_da: ["L0", "L1", "L2"]
    nota: "letto, mai stimato"

  - nome: "lancio sospendi <id> --motivo <testo> --revisione <data>"
    fa: "porta il lancio in SOSPESO e congela gli orologi"
    invocabile_da: ["L0", "L1"]

  - nome: "lancio riprendi <id>"
    fa: "riporta il lancio allo stato di partenza con un verbale"
    invocabile_da: ["L0", "L1"]

  - nome: "lancio firma <id> --prezzo <n> --data <gg/mm/aaaa>"
    fa: "registra la firma umana sul prezzo, con canale comando-utente e impronta della proposta"
