name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-bookworm
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[security,test]'
      - run: bash scripts/ci_setup_postgres.sh
        env: {POSTGRES_ADMIN_PASSWORD: postgres}
      - name: Install pinned OPA
        run: |
          curl -fsSL -o /tmp/opa https://github.com/open-policy-agent/opa/releases/download/v1.19.1/opa_linux_amd64_static
          echo "c9f985ce0d345f5484006ade2c695ed9e3f308e4441139e46695c5c182ac0839  /tmp/opa" | sha256sum -c -
          chmod +x /tmp/opa
          /tmp/opa run --server --addr=127.0.0.1:8181 policies >/tmp/opa.log 2>&1 &
      - name: Full Python and integration suite
        run: python -m unittest discover -s tests -v
        env:
          OPA_BIN: /tmp/opa
          OCP_OPA_URL: http://127.0.0.1:8181
          OCP_TEST_DATABASE_URL: postgresql+asyncpg://ocp_runtime:runtime-test@127.0.0.1:5432/ocp_test
          OCP_W13_DATABASE_URL: postgresql+asyncpg://ocp_runtime:runtime-test@127.0.0.1:5432/ocp_test
      - run: bandit -r src
      - run: pip-audit .
      - run: python scripts/secret_scan.py

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: ruflo_bridge}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: ruflo_bridge/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
