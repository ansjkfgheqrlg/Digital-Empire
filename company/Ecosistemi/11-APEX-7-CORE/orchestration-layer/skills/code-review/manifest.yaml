{
  "apiVersion": "orchestration/v1",
  "kind": "Skill",
  "metadata": {"id": "code-review", "version": "1.0.0", "owner": "quality-team"},
  "spec": {
    "status": "ACTIVE",
    "riskClass": "R1",
    "inputSchema": "schemas/input.json",
    "outputSchema": "schemas/output.json",
    "capabilities": ["repo.read", "artifact.write:review/**"],
    "timeoutSeconds": 120,
    "budgets": {"maxTokens": 30000, "maxCostUsd": 2.0},
    "idempotency": "required",
    "sandbox": "repository-readonly-artifact-write",
    "runtime": {"baseline": "local", "ruflo": "disabled"}
  }
}
