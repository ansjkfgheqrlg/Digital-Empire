
<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Empire Team | AI Automation & Web Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=JetBrains+Mono:wght@400;700&family=Permanent+Marker&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                100: '#FFFEF5', // Almost White/Cream (Top of button)
                200: '#FCF6D6', // Pale Champagne
                300: '#F6E8B1', 
                400: '#EED688',
                500: '#E3C878', // PRIMARY PALE GOLD
                600: '#C5A059', // Darker metallic gold
                700: '#9E7D3D',
                800: '#755928',
                900: '#402E11',
              },
              purple: {
                400: '#c084fc',
                500: '#a855f7',
                600: '#9333ea',
                900: '#581c87',
                950: '#3b0764',
              },
              black: {
                800: '#1a1a1a',
                900: '#0a0a0a',
                950: '#050505',
                deep: '#020202',
              }
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
              playfair: ['Playfair Display', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
              marker: ['Permanent Marker', 'cursive'],
              hand: ['Kalam', 'cursive'],
            },
            backgroundImage: {
              'gold-gradient': 'linear-gradient(180deg, #FFFEF5 0%, #E3C878 100%)',
              'metal-gradient': 'linear-gradient(to right, #C5A059, #FCF6D6, #C5A059)',
              'hero-glow': 'radial-gradient(circle at center, rgba(168, 85, 247, 0.15) 0%, rgba(3, 0, 20, 0) 70%)',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'twinkle': 'twinkle 4s ease-in-out infinite',
              'twinkle-slow': 'twinkle 7s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              twinkle: {
                '0%, 100%': { opacity: '0.4', transform: 'scale(0.8)' },
                '50%': { opacity: '1', transform: 'scale(1.1)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #E3C878;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 100px;
      }
      
      body {
        /* PURE BLACK for maximum contrast with the new clean stars */
        background-color: #020202;
        /* Removed noisy gradients to ensure cleaner render */
        position: relative;
        min-height: 100vh;
      }
      
      #root {
        position: relative;
        z-index: 10;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.2",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@6.22.3",
    "react-router": "https://aistudiocdn.com/react-router@6.22.3",
    "@remix-run/router": "https://aistudiocdn.com/@remix-run/router@1.15.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="text-white antialiased selection:bg-gold-500 selection:text-black">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
