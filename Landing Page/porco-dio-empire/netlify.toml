[build]
  command = "npm run build"
  publish = "out"
  # La cartella delle funzioni va dichiarata, altrimenti Netlify pubblica solo
  # i file statici e `/api/iscrizione` risponde 404 (B-020, 2026-09-09).
  functions = "netlify/functions"

# La chiave di Brevo NON sta nel codice: si imposta nel pannello del sito,
# Site settings -> Environment variables, come BREVO_API_KEY.
